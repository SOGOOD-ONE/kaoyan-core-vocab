<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:title" content="考研英语核心词">
  <meta property="og:description" content="基于艾宾浩斯遗忘曲线的考研英语核心词汇学习系统，支持新学单词两遍英译汉与一遍汉翻英、自主复习">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
:root{
  --primary:#3B82F6;--on-primary:#FFFFFF;
  --primary-container:#DBEAFE;--on-primary-container:#1E40AF;
  --primary-light:#EFF6FF;
  --surface:#FFFFFF;--surface-variant:#F8FAFC;
  --on-surface:#0F172A;--on-surface-variant:#64748B;
  --outline:#E2E8F0;--outline-variant:#F1F5F9;
  --error:#EF4444;--error-container:#FEE2E2;--on-error:#991B1B;
  --success:#10B981;--success-container:#D1FAE5;--on-success:#065F46;
  --warning:#F59E0B;--warning-container:#FEF3C7;--on-warning:#92400E;
  --background:#F0F4F8;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.06);
  --shadow-lg:0 8px 24px rgba(0,0,0,.08);
  --radius-sm:10px;
  --radius-md:14px;
  --radius-lg:18px;
  --radius-xl:22px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--background);color:var(--on-surface);
  min-height:100vh;-webkit-font-smoothing:antialiased;
}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--background);position:relative}
.view{display:none;min-height:100vh;animation:fadeIn .3s ease}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ===== Home ===== */
.home-header{padding:32px 20px 8px;text-align:center}
.home-title{font-size:22px;font-weight:700;letter-spacing:.3px;color:var(--on-surface)}
.home-subtitle{font-size:13px;color:var(--on-surface-variant);margin-top:4px}

/* Daily Goal Card */
.daily-goal-card{
  margin:16px 20px;padding:24px 20px;border-radius:var(--radius-xl);
  background:var(--surface);box-shadow:var(--shadow-sm);
  border:1px solid var(--outline-variant);
}
.daily-goal-title{font-size:16px;font-weight:700;color:var(--on-surface);margin-bottom:2px}
.daily-goal-subtitle{font-size:12px;color:var(--on-surface-variant);margin-bottom:16px}
.daily-goal-btns{display:flex;gap:10px}
.daily-goal-btn{
  flex:1;padding:12px 0;border-radius:var(--radius-md);
  border:2px solid var(--outline);background:var(--surface);
  font-size:16px;font-weight:700;color:var(--on-surface-variant);
  cursor:pointer;transition:all .2s ease;
}
.daily-goal-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.daily-goal-btn.active{
  border-color:var(--primary);background:var(--primary-light);
  color:var(--on-primary-container);
}
.daily-goal-progress{
  margin-top:12px;height:6px;border-radius:3px;
  background:var(--surface-variant);overflow:hidden;
}
.daily-goal-progress-fill{
  height:100%;background:var(--primary);
  border-radius:3px;transition:width .5s ease;
}

/* Mode Tabs */
.mode-tabs{
  margin:16px 20px;display:flex;gap:10px;
}
.mode-tab{
  flex:1;padding:16px 12px;border-radius:var(--radius-lg);
  background:var(--surface);border:2px solid transparent;
  cursor:pointer;transition:all .2s ease;
  box-shadow:var(--shadow-sm);text-align:center;
}
.mode-tab:hover{border-color:var(--outline);transform:translateY(-1px)}
.mode-tab.active{
  background:var(--primary-light);border-color:var(--primary);
  box-shadow:0 2px 8px rgba(59,130,246,.15);
}
.mode-tab-icon{font-size:24px;margin-bottom:6px}
.mode-tab-title{font-size:15px;font-weight:700;color:var(--on-surface)}
.mode-tab-desc{font-size:11px;color:var(--on-surface-variant);line-height:1.3}
.mode-tab.active .mode-tab-title{color:var(--on-primary-container)}
.mode-tab.active .mode-tab-desc{color:var(--primary)}

/* Stats Row */
.stats-row{
  margin:16px 20px;padding:18px 12px;border-radius:var(--radius-lg);
  background:var(--surface);box-shadow:var(--shadow-sm);
  display:flex;justify-content:space-around;
  border:1px solid var(--outline-variant);
}
.stat-item{text-align:center;flex:1}
.stat-num{font-size:24px;font-weight:800;color:var(--primary);line-height:1.2}
.stat-num.warn{color:var(--warning)}
.stat-num.error{color:var(--error)}
.stat-num.success{color:var(--success)}
.stat-num.muted{color:var(--on-surface-variant)}
.stat-label{font-size:11px;color:var(--on-surface-variant);margin-top:4px;font-weight:500}

/* Action Buttons */
.home-actions{margin:16px 20px;display:flex;flex-direction:column;gap:10px}
.action-btn{
  width:100%;padding:16px;border-radius:var(--radius-lg);
  border:none;font-size:16px;font-weight:700;cursor:pointer;
  transition:all .2s ease;display:flex;align-items:center;justify-content:center;gap:8px;
}
.action-btn.primary{
  background:var(--primary);color:#fff;
  box-shadow:0 4px 12px rgba(59,130,246,.25);
}
.action-btn.primary:hover{background:#2563EB;box-shadow:0 6px 16px rgba(59,130,246,.35)}
.action-btn.primary:active{transform:scale(.98)}
.action-btn.primary:disabled{background:var(--outline);color:var(--on-surface-variant);box-shadow:none;cursor:not-allowed}
.action-btn.secondary{
  background:var(--surface);color:var(--on-surface);
  border:2px solid var(--outline);
}
.action-btn.secondary:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.action-btn.secondary:active{transform:scale(.98)}
.action-btn.secondary:disabled{border-color:var(--outline);color:var(--outline);cursor:not-allowed;background:var(--surface)}
.action-btn.tertiary{
  background:var(--surface);color:var(--success);
  border:2px solid var(--success-container);
}
.action-btn.tertiary:hover{background:var(--success-container);border-color:var(--success)}
.action-btn.tertiary:active{transform:scale(.98)}
.action-btn.tertiary:disabled{border-color:var(--outline);color:var(--outline);cursor:not-allowed;background:var(--surface)}

/* Resume Banner */
.resume-banner{
  margin:0 20px 16px;padding:16px 18px;border-radius:var(--radius-lg);
  background:linear-gradient(135deg,#FEF3C7,#FDE68A);
  border:1px solid #FCD34D;
}
.resume-banner-title{font-size:13px;color:#92400E;font-weight:700;margin-bottom:4px}
.resume-banner-desc{font-size:12px;color:#78350F;margin-bottom:12px}
.resume-banner-actions{display:flex;gap:10px}
.resume-btn-primary{flex:1;padding:10px;border-radius:var(--radius-sm);border:none;background:#F59E0B;color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.resume-btn-secondary{padding:10px 16px;border-radius:var(--radius-sm);border:1px solid #FBBF24;background:#fff;color:#92400E;font-size:13px;font-weight:600;cursor:pointer}

/* Progress Card */
.progress-card{
  margin:16px 20px;padding:20px;border-radius:var(--radius-lg);
  background:var(--surface);box-shadow:var(--shadow-sm);
  border:1px solid var(--outline-variant);
}
.progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.progress-title{font-size:14px;font-weight:700;color:var(--on-surface)}
.progress-value{font-size:13px;font-weight:600;color:var(--on-surface-variant)}
.progress-bar{height:6px;background:var(--outline-variant);border-radius:3px;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),#60A5FA);border-radius:3px;transition:width .5s ease}
.progress-detail{display:flex;gap:16px;margin-top:14px;font-size:12px;color:var(--on-surface-variant);flex-wrap:wrap}
.progress-detail span b{color:var(--on-surface);font-weight:700}

/* Section */
.home-section{margin:20px 20px 8px}
.home-section-title{font-size:14px;font-weight:700;color:var(--on-surface);margin-bottom:10px}

/* Data Buttons */
.data-row{display:flex;gap:10px;margin:0 20px 12px;flex-wrap:wrap}
.data-btn{flex:1;min-width:130px;padding:12px;border-radius:var(--radius-md);
  border:1px solid var(--outline);background:var(--surface);
  color:var(--on-surface-variant);font-size:13px;font-weight:600;
  cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:6px}
.data-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.data-btn.import-btn{border-color:var(--success-container);color:var(--success)}
.data-btn.import-btn:hover{background:var(--success-container)}

/* Timer Card */
.timer-card{margin:16px 20px;display:flex;gap:10px}
.timer-item{flex:1;padding:16px;border-radius:var(--radius-lg);background:var(--surface);text-align:center;box-shadow:var(--shadow-sm);border:1px solid var(--outline-variant)}
.timer-item.today{background:linear-gradient(135deg,var(--primary-light),var(--surface))}
.timer-num{font-size:26px;font-weight:800;color:var(--primary);line-height:1.2}
.timer-unit{font-size:13px;font-weight:500;color:var(--on-surface-variant)}
.timer-label{font-size:11px;color:var(--on-surface-variant);margin-top:4px}

.reset-btn{display:block;margin:16px auto 8px;padding:8px 16px;border:none;background:transparent;
  color:var(--error);font-size:13px;cursor:pointer;opacity:.6}
.reset-btn:hover{opacity:1}
.logout-btn{display:block;margin:8px auto 32px;padding:8px 16px;border:none;background:transparent;
  color:var(--on-surface-variant);font-size:13px;cursor:pointer;opacity:.6}
.logout-btn:hover{opacity:1;color:var(--error)}

.user-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;
  background:var(--primary-container);color:var(--on-primary-container);font-size:13px;font-weight:600}

/* ===== Study / Review（新 UI：灰白极简风） ===== */
.kw-page{max-width:430px;margin:0 auto;padding:12px 18px 24px;min-height:100vh;display:flex;flex-direction:column}
.kw-topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 2px 12px}
.kw-close{background:none;border:none;color:#A1A1AA;font-size:17px;line-height:1;padding:4px;cursor:pointer;transition:color .12s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.kw-close:hover{color:#52525B}
.kw-progress-track{width:130px;height:5px;border-radius:99px;background:#E4E4E7;overflow:hidden;flex-shrink:0}
.kw-progress-fill{height:100%;background:#27272A;border-radius:99px;transition:width .2s ease;width:0%}
.kw-count{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;color:#A1A1AA;white-space:nowrap}
.kw-card{
  position:relative;background:#fff;border-radius:18px;padding:24px 20px;
  box-shadow:0 4px 20px -4px rgba(0,0,0,.04);border:1px solid rgba(228,228,231,.7);
  display:flex;flex-direction:column;align-items:center;text-align:center;
  transform:translateZ(0);will-change:opacity,transform;
}
/* 卡片入场动画：每次切题时由 JS 重新触发，缓解"僵硬"感 */
@keyframes cardEnter{
  from{opacity:0;transform:translateY(10px) scale(.985)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.card-enter{animation:cardEnter .18s cubic-bezier(.2,.7,.3,1) both}

.kw-retest{position:absolute;top:12px;left:12px;padding:2px 8px;border-radius:8px;background:#F4F4F5;
  color:#71717A;font-size:13px;font-weight:500}

.kw-word-row{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0 2px}
.kw-word{font-size:28px;font-weight:700;letter-spacing:-.3px;color:#18181B;word-break:break-word;line-height:1.3}
.kw-speak{background:none;border:none;color:#A1A1AA;padding:4px;cursor:pointer;transition:color .12s,transform .08s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.kw-speak:hover{color:#3F3F46}
.kw-speak:active{transform:scale(.9)}
.kw-speak svg{width:18px;height:18px;display:block}
.kw-speak.speaking{animation:pulse .6s ease infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.kw-hf{margin-top:8px;padding:4px 10px;border-radius:99px;background:linear-gradient(135deg,#FFF3E0,#FFE0B2);
  color:#E65100;font-size:13px;font-weight:600}

/* 选对后才展开的释义区（默认隐藏） */
.kw-meaning{display:none;align-items:center;justify-content:space-between;gap:8px;
  width:100%;margin-top:14px;padding-top:12px;border-top:1px solid #F4F4F5;text-align:left}
.kw-meaning.show{display:flex}
.kw-meaning-text{font-size:14px;font-weight:500;color:#3F3F46;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kw-meaning.open .kw-meaning-text{white-space:normal}
.kw-more{flex-shrink:0;display:flex;align-items:center;gap:2px;background:none;border:none;color:#A1A1AA;
  font-size:13px;cursor:pointer;padding:2px}
.kw-more:hover{color:#3F3F46}
.kw-more svg{width:11px;height:11px;transition:transform .15s}
.kw-meaning.open .kw-more svg{transform:rotate(180deg)}

/* 四个选项（与单词卡同色卡片） */
.kw-options{display:flex;flex-direction:column;gap:11px;margin-top:14px;will-change:opacity,transform}
.kw-opt{width:100%;min-height:52px;padding:13px 18px;border-radius:18px;background:#fff;
  border:1px solid rgba(228,228,231,.7);box-shadow:0 4px 20px -4px rgba(0,0,0,.03);
  display:flex;flex-direction:column;align-items:stretch;justify-content:center;
  text-align:left;font-size:15px;color:#3F3F46;cursor:pointer;line-height:1.4;
  transition:border-color .12s ease,background-color .12s ease,transform .08s ease,opacity .15s ease;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;transform:translateZ(0);will-change:transform}
.kw-opt:active:not(.disabled){transform:scale(.99)}
.kw-opt.disabled{cursor:default}
.kw-opt-line{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kw-opt-text{overflow:hidden;text-overflow:ellipsis}
.kw-opt.correct{background:rgba(236,253,245,.8);border-color:#34D399;color:#064E3B;font-weight:500}
.kw-opt.wrong{background:rgba(254,242,242,.8);border-color:#FCA5A5;color:#7F1D1D;animation:kwShake .25s ease-in-out}
.kw-opt.dimmed{pointer-events:none}
.kw-opt-ico{display:none;font-weight:700;font-size:15px;flex-shrink:0}
.kw-opt.correct .kw-opt-ico{display:block;color:#059669}
.kw-opt.wrong .kw-opt-ico{display:block;color:#EF4444}
.kw-opt-trans{display:none;margin-top:3px;font-size:13px;color:#A1A1AA}
.kw-opt.revealed .kw-opt-trans{display:block}
@keyframes kwShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* 查看选项释义（键盘空格可切换）：选项下方的低调文字按钮 */
.kw-reveal-row{margin-top:16px;text-align:center}
.kw-reveal{background:none;border:none;color:#A1A1AA;font-size:13px;padding:6px 12px;cursor:pointer;
  transition:color .12s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.kw-reveal:hover{color:#52525B}
.kw-reveal.revealed{color:#3F3F46;font-weight:500}

/* 斩掉：学习/复习共用 fsrs-rating 一排按钮，红色字（见评分面板） */

/* ===== Complete ===== */
.complete-container{padding:60px 24px;text-align:center;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.complete-icon{width:72px;height:72px;border-radius:50%;background:var(--success-container);
  display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:36px;color:var(--success)}
.complete-title{font-size:24px;font-weight:700;margin-bottom:8px}
.complete-subtitle{font-size:14px;color:var(--on-surface-variant);margin-bottom:32px}
.complete-stats{display:flex;gap:16px;margin-bottom:32px}
.complete-stat{flex:1;padding:20px;border-radius:16px;background:var(--surface-variant)}
.complete-stat-num{font-size:32px;font-weight:700;color:var(--primary)}
.complete-stat-num.green{color:var(--success)}
.complete-stat-num.red{color:var(--error)}

/* Vocab list page */
.vocab-header{position:sticky;top:0;z-index:10;background:var(--background);padding:12px 16px;border-bottom:1px solid var(--outline)}
.vocab-header-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.vocab-back-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--outline);background:var(--surface);cursor:pointer;font-size:14px}
.vocab-title{flex:1;font-size:18px;font-weight:700}
.vocab-count{font-size:13px;color:var(--on-surface-variant)}
.vocab-search{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--outline);
  background:var(--surface);font-size:14px;outline:none;box-sizing:border-box}
.vocab-search:focus{border-color:var(--primary)}
.vocab-filter-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.vocab-filter-btn{padding:6px 12px;border-radius:16px;border:1px solid var(--outline);
  background:var(--surface);font-size:12px;cursor:pointer;color:var(--on-surface-variant)}
.vocab-filter-btn.active{border-color:var(--primary);background:var(--primary-container);color:var(--primary)}
.vocab-export-btn{padding:8px 16px;border-radius:10px;border:1px solid var(--success);
  background:transparent;color:var(--success);font-size:13px;font-weight:500;cursor:pointer}
.vocab-list{padding:8px 0}
.vocab-item{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--surface-variant);gap:12px;content-visibility:auto;contain-intrinsic-size:auto 54px}
.vocab-item:hover{background:var(--surface)}
.vocab-word{font-size:16px;font-weight:600;min-width:120px}
.vocab-type{font-size:12px;color:var(--on-surface-variant);min-width:50px}
.vocab-meaning{flex:1;font-size:14px;color:var(--on-surface);line-height:1.4}
.vocab-status{font-size:11px;padding:2px 8px;border-radius:10px;white-space:nowrap}
.vocab-status.new{background:#FEF3C7;color:#92400E}
.vocab-status.learning{background:#DBEAFE;color:#1E40AF}
.vocab-status.review{background:#D1FAE5;color:#065F46}
.vocab-status.relearning{background:#FEE2E2;color:#991B1B}
.vocab-status.mastered{background:#E0E7FF;color:#3730A3}
.vocab-status.ignored{background:#E5E7EB;color:#4B5563}
.complete-stat-label{font-size:12px;color:var(--on-surface-variant);margin-top:4px}
.complete-accuracy{font-size:16px;color:var(--on-surface-variant);margin-bottom:24px}
.complete-accuracy span{font-weight:700;color:var(--on-surface);font-size:20px}
.next-review-info{padding:16px;border-radius:12px;background:var(--primary-container);color:var(--on-primary-container);
  font-size:14px;margin-bottom:24px}

/* ===== 评分面板（复习：斩/模糊/记得；学习：斩/继续。与单词卡同色卡片，一排按钮） ===== */
.fsrs-rating-panel{margin-top:14px}
.fsrs-rating-grid{display:flex;gap:8px}
.fsrs-rating-btn{flex:1;height:50px;border-radius:18px;background:#fff;
  border:1px solid rgba(228,228,231,.7);box-shadow:0 4px 20px -4px rgba(0,0,0,.03);
  font-size:15px;font-weight:500;color:#3F3F46;cursor:pointer;
  transition:background-color .12s ease,transform .08s ease,opacity .15s ease;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;transform:translateZ(0);will-change:transform}
.fsrs-rating-btn:hover:not(:disabled){background:#F4F4F5}
.fsrs-rating-btn:active:not(:disabled), .fsrs-rating-btn.active-selected{transform:scale(.95)}
.fsrs-rating-btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
/* 评分行内的斩按钮：红色字 */
.kw-ignore-inline{color:#DC2626}
.kw-ignore-inline:hover{background:#FFF5F5}
/* 选错提示条：答错时说明评分强制按模糊处理 */
.fsrs-rating-hint{margin:0 0 10px;padding:8px 12px;border-radius:10px;
  background:#FFF7F7;border:1px solid #FECACA;color:#B91C1C;font-size:13px;
  text-align:center;line-height:1.4}

/* ===== Toast ===== */
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  padding:16px 28px;border-radius:16px;background:rgba(28,27,31,.9);color:#fff;

.login-input{width:100%;padding:16px 20px;border-radius:16px;border:2px solid var(--outline);

<body>
<div id="app">
  <div id="view-login" class="view"></div>
  <div id="view-home" class="view"></div>
  <div id="view-study" class="view"></div>
  <div id="view-complete" class="view"></div>
  <div id="view-vocab" class="view"></div>
</div>
<div id="toast" style="display:none"></div>
<div id="import-modal" style="display:none"></div>
<div id="confirm-modal" style="display:none"></div>

<script src="./data.js?v=20260916"></script>
<script>
// ===== Config =====
const REVIEW_INTERVALS = [1, 2, 4, 7, 15, 20]; // Legacy, kept for migration

// ===== 艾宾浩斯遗忘曲线调度器 =====
// 取代原 ts-fsrs(FSRS-6) 调度引擎，改为经典的艾宾浩斯遗忘曲线复习间隔：
// 每复习一次（记得 Good）间隔按 1→2→4→7→15→20 天递增（封顶 20 天，
// 考前持续重复的需求：间隔到 20 天后不再拉长，保持高频重复）；
// 模糊(Again)回到最短间隔（1 天）并计入 lapses。
// 字段结构(stability/difficulty/state/nextReview 等)保持不变，
// 兼容已存档数据与所有既有调用点。
const MASTERED_STABILITY_THRESHOLD = 20; // 间隔 >= 20天 且 state===Review 视为已掌握

let fsrsScheduler = null;

// 艾宾浩斯遗忘曲线：天级复习间隔表
const EB_INTERVALS = REVIEW_INTERVALS;

// 把任意天数的旧间隔吸附到最近的艾宾浩斯档位(取 <=days 的最大档位)。
// 旧 FSRS 存档的 stability 是 8/17/27 等任意值，直接参与 ebNextTier 会
// 因为 indexOf 查不到档位(tier=-1)而把首次复习"记得"压回 1 天——存量词
// 的间隔被大幅压缩、集中到期形成复习风暴。吸附后从既有档位继续推进。
function snapToEBIntervals(days){
  days = Math.max(0, Math.round(Number(days)||0));
  if(days<=0) return 0;
  for(let i=EB_INTERVALS.length-1; i>=0; i--){
    if(days>=EB_INTERVALS[i]) return EB_INTERVALS[i];
  }
  return EB_INTERVALS[0];
}

// 计算下一个复习间隔（天）：tier = 当前所处间隔档位
function ebNextTier(prevDays, rating){
  let tier = EB_INTERVALS.indexOf(prevDays);
  if(tier < 0) tier = -1; // 不在表中的旧/空数据从 0 天档之前开始（首次答题进 1 天）
  if(rating===1) return 0; // 模糊 → 1 天
  return Math.min(tier+1, EB_INTERVALS.length-1); // 记得 → 进 1 档
}

// 纯本地艾宾浩斯调度器：方法形态对齐官方 ts-fsrs scheduler
function createEbbinghausScheduler(){
  return {
    next(card, now, rating){
      const days = EB_INTERVALS[ebNextTier(card.scheduled_days || card.stability || 0, rating)];
      const isAgain = rating===1;
      const state = (isAgain && (card.reps||0)>=2) ? 3 : (isAgain ? 1 : 2);
      return {
        card: {
          due: new Date(now.getTime() + days*86400000),
          stability: days,
          difficulty: 0,
          elapsed_days: card.last_review ? Math.max(0,(now.getTime()-new Date(card.last_review).getTime())/86400000) : 0,
          scheduled_days: days,
          reps: (card.reps||0)+1,
          lapses: (card.lapses||0)+(isAgain?1:0),
          state,
          learning_steps: 0,
          last_review: new Date(now.getTime())
        }
      };
    },
    get_retrievability(card, now, format){
      // 简化估算：距到期日越近，"记忆率"越低（仅用于复习排序）
      const days = card.scheduled_days || card.stability || 1;
      const elapsed = card.last_review ? Math.max(0,(now.getTime()-new Date(card.last_review).getTime())/86400000) : 0;
      let r = Math.max(0, 1 - elapsed/Math.max(1,days));
      if(format) r *= 100;
      return r;
    }
  };
}

function getFSRSScheduler(){
  if(!fsrsScheduler) fsrsScheduler = createEbbinghausScheduler();
  return fsrsScheduler;
}

function fsrsApi(){
  // 两档评分：1=模糊 Again（重置 1 天），3=记得 Good（进 1 档）。保留 State 枚举以兼容旧数据。
  return {
    State: { New: 0, Learning: 1, Review: 2, Relearning: 3 },
    Rating: { Again: 1, Good: 3 },
    createEmptyCard: () => ({ due: new Date(), stability: 0, difficulty: 0, elapsed_days: 0, scheduled_days: 0, reps: 0, lapses: 0, state: 0, learning_steps: 0, last_review: null })
  };
}

// State enum helpers
function fsrsStateName(state){
  const api=fsrsApi();
  if(state===api.State.New) return 'New';
  if(state===api.State.Learning) return 'Learning';
  if(state===api.State.Review) return 'Review';
  if(state===api.State.Relearning) return 'Relearning';
  return String(state);
}

// Rating enum helpers（两档：1=模糊 Again, 3=记得 Good）
function fsrsRatingName(rating){
  const api=fsrsApi();
  if(rating===api.Rating.Again) return 'Again';
  if(rating===api.Rating.Good) return 'Good';
  return String(rating);
}

function fsrsRatingFromStudyResult(correctCount){
  // 两档语义：全部答对 → 记得（进一档）；有错 → 模糊（重置 1 天）
  const api=fsrsApi();
  return correctCount>=3 ? api.Rating.Good : api.Rating.Again;
}

// Serialize an official Card into a JSON-safe object stored under word.fsrs.
function serializeFSRSCard(card){
  return {
    due: card.due instanceof Date ? card.due.getTime() : Number(card.due),
    stability: card.stability ?? 0,
    difficulty: card.difficulty ?? 0,
    elapsed_days: card.elapsed_days ?? 0,
    scheduled_days: card.scheduled_days ?? 0,
    reps: card.reps ?? 0,
    lapses: card.lapses ?? 0,
    state: card.state,
    // FSRS 卡片里"学习步进"的真实字段名是 learning_steps，不是 step。
    // 写错会让每次读回都从第 0 步重来：Good 永远只能排到 10 分钟后，
    // Learning 状态的卡片永远无法毕业。
    learning_steps: card.learning_steps ?? 0,
    last_review: card.last_review instanceof Date ? card.last_review.getTime() : (card.last_review ?? null)
  };
}

// Hydrate a saved card object back into a usable FSRS Card
function hydrateFSRSCard(saved){
  const api=fsrsApi();
  const card=api.createEmptyCard();
  if(!saved) return card;
  return {
    ...card,
    due: new Date(saved.due || Date.now()),
    stability: Number(saved.stability || 0),
    difficulty: Number(saved.difficulty || 0),
    elapsed_days: Number(saved.elapsed_days || 0),
    scheduled_days: Number(saved.scheduled_days || 0),
    reps: Number(saved.reps || 0),
    lapses: Number(saved.lapses || 0),
    state: saved.state ?? api.State.New,
    // 兼容早期误写成 step 的存档
    learning_steps: Number(saved.learning_steps ?? saved.step ?? 0),
    last_review: saved.last_review ? new Date(saved.last_review) : undefined
  };
}

// Get FSRS Card from word state (handles both new format with .fsrs and legacy format)
function getFSRSCard(wordState){
  if(wordState && wordState.fsrs) return hydrateFSRSCard(wordState.fsrs);
  // Legacy records: reconstruct FSRS card from old D/S/lastReview/nextReview fields
  const api=fsrsApi();
  const card=api.createEmptyCard();
  if(wordState && (wordState.stability!==undefined || wordState.difficulty!==undefined)){
    card.due=new Date(wordState.nextReview || Date.now());
    card.stability=Number(wordState.stability || 1);
    card.difficulty=Number(wordState.difficulty || 5);
    card.state=api.State.Review;
    card.reps=Math.max(1,(wordState.correct||0)+(wordState.wrong||0));
    card.lapses=Number(wordState.wrong||0);
    card.last_review=wordState.lastReview ? new Date(wordState.lastReview) : undefined;
    card.elapsed_days=card.last_review ? Math.max(0,(Date.now()-card.last_review.getTime())/86400000) : 0;
    card.scheduled_days=Math.max(0,Math.round(card.stability));
  }
  return card;
}

// Sync FSRS card data back to word state (keeps legacy fields for UI compatibility)
function syncLegacyFieldsFromCard(wordState, card, rating){
  const api=fsrsApi();
  wordState.fsrs=serializeFSRSCard(card);
  wordState.stability=card.stability;
  wordState.difficulty=card.difficulty;
  wordState.lastReview=card.last_review ? new Date(card.last_review).getTime() : Date.now();
  wordState.nextReview=card.due instanceof Date ? card.due.getTime() : Number(card.due);
  wordState.fsrsState=fsrsStateName(card.state);

  // Legacy level display compatibility（两档：模糊-1 / 记得+1）
  if(rating===api.Rating.Again) wordState.level=Math.max(0,(wordState.level||0)-1);
  else wordState.level=Math.min(6,(wordState.level||0)+1);

  // "已掌握" = stability >= 20天 AND state === Review
  // ignored status is preserved
  const total=(wordState.correct||0)+(wordState.wrong||0);
  const accuracy=total ? (wordState.correct||0)/total : 0;
  if(card.state===api.State.Review && card.stability>=MASTERED_STABILITY_THRESHOLD && total>=5 && accuracy>=0.8){
    wordState.status='mastered';
  }else if(wordState.status!=='ignored'){
    wordState.status='review';
  }
}

// Check if a word is in "mastered" state using FSRS criteria
function isWordMastered(wp){
  if(!wp || wp.status==='ignored') return false;
  if(wp.status==='mastered') return true; // cached status
  // Check FSRS criteria directly
  if(wp.fsrs){
    const api=fsrsApi();
    return wp.fsrs.state===api.State.Review && wp.fsrs.stability>=MASTERED_STABILITY_THRESHOLD;
  }
  return false;
}

// Migrate old word data to 艾宾浩斯复习卡格式
function migrateToEB(word){
  if(word.status==='ignored') return; // ignored words don't need FSRS card
  if(word.fsrs){
    // Already migrated, just normalize timestamps + snap stability to EB tiers
    const c=hydrateFSRSCard(word.fsrs);
    const s=snapToEBIntervals(c.stability);
    c.stability=s; c.scheduled_days=s;
    word.fsrs=serializeFSRSCard(c);
    word.stability=s;
    word.difficulty=c.difficulty;
    word.nextReview=c.due.getTime();
    word.fsrsState=fsrsStateName(c.state);
    return;
  }
  // Legacy migration: build FSRS card from old fields
  const card=getFSRSCard(word);
  const s=snapToEBIntervals(card.stability);
  card.stability=s; card.scheduled_days=s;
  word.fsrs=serializeFSRSCard(card);
  word.stability=card.stability;
  word.difficulty=card.difficulty;
  word.nextReview=card.due.getTime();
  word.lastReview=card.last_review ? card.last_review.getTime() : (word.lastReview||null);
  word.fsrsState=fsrsStateName(card.state);
  if(!word.status || word.status==='new') word.status='review';
}

// Get retrievability (current recall probability)
function fsrsRetrievability(wordState, now=Date.now()){
  if(!wordState) return 0;
  try{
    const scheduler = getFSRSScheduler();
    if(!scheduler) return 0;
    const card=getFSRSCard(wordState);
    return scheduler.get_retrievability(card,new Date(now),false);
  }catch(e){ return 0; }
}

// Apply one official FSRS rating. Returns the scheduler result.
function applyFSRSRating(wordState,rating,now=Date.now()){
  const scheduler = getFSRSScheduler();
  const card=getFSRSCard(wordState);
  const before=serializeFSRSCard(card);
  if(scheduler && typeof scheduler.next==='function'){
    const result=scheduler.next(card,new Date(now),rating);
    const after=result.card;
    syncLegacyFieldsFromCard(wordState,after,rating);
    return {result,before,after:serializeFSRSCard(after)};
  }
  // Fallback if scheduler is completely unavailable
  return {result:{card},before,after:before};
}

// Check if a card is due for review
function isCardDue(wordState, now=Date.now()){
  if(!wordState || wordState.status==='ignored') return false;
  if(wordState.status==='new' || !wordState.fsrs) return false;
  return wordState.nextReview <= now;
}

// Beijing time (UTC+8) with 5 AM as daily boundary
// Before 5 AM = still "yesterday" in study terms
function dateToStudyDay(ts){
  const d=new Date(ts);
  const beijing=new Date(d.getTime()+8*3600000);
  if(beijing.getUTCHours()<5) beijing.setUTCDate(beijing.getUTCDate()-1);
  return beijing.toISOString().split('T')[0];
}
function getToday(){ return dateToStudyDay(Date.now()); }
function getYesterday(){
  const now=new Date();
  const beijing=new Date(now.getTime()+8*3600000);
  if(beijing.getUTCHours()<5) beijing.setUTCDate(beijing.getUTCDate()-2);
  else beijing.setUTCDate(beijing.getUTCDate()-1);
  return beijing.toISOString().split('T')[0];
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function escapeHtml(text){
  if(!text) return '';
  return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// 用于内联 onclick 里的单引号 JS 字符串，例如 onclick="speakWord('这里')"。
// 只转义单引号是不够的：反斜杠会让 JS 字符串提前结束，双引号会提前闭合 HTML 属性。
function jsStringArg(text){
  if(text===undefined || text===null) return '';
  return String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/"/g, '&quot;');
}

// 词库缓存：getAllVocab() 会被十几个统计函数反复调用，词库没变时直接复用
let _vocabCache=null, _vocabCacheSrc=null, _vocabCacheSrcLen=-1, _vocabCacheCustom=null, _vocabCacheCustomLen=-1;
let _vocabByCategory=null, _hfCountCache=null;

function invalidateVocabCache(){
  _vocabCache=null;
  _vocabByCategory=null;
  _hfCountCache=null;
}

function getVocabCategoryMap(){
  if(_vocabByCategory) return _vocabByCategory;
  const all = getAllVocab();
  const map = new Map();
  for(let i=0; i<all.length; i++){
    const w = all[i];
    const cat = w.category || '默认';
    let list = map.get(cat);
    if(!list){ list = []; map.set(cat, list); }
    list.push(w);
  }
  _vocabByCategory = map;
  return _vocabByCategory;
}

function getAllVocab(){
  const custom = Array.isArray(customVocab) ? customVocab : [];
  const srcLen = Array.isArray(VOCAB_DATA) ? VOCAB_DATA.length : -1;
  if(_vocabCache && _vocabCacheSrc===VOCAB_DATA && _vocabCacheSrcLen===srcLen &&
     _vocabCacheCustom===customVocab && _vocabCacheCustomLen===custom.length){
    return _vocabCache;
  }
  const seen=new Set();
  const merged=[];
  const source = Array.isArray(VOCAB_DATA) ? VOCAB_DATA : [];
  // 释义合并结果（meaningOverrides）优先于词条本身的 meaning
  const meaningOv = progress && progress.meaningOverrides ? progress.meaningOverrides : null;
  for(const w of source){
    if(!w || !w.word) continue;
    const key=w.word.toLowerCase();
    if(!seen.has(key)){
      seen.add(key);
      merged.push(meaningOv && meaningOv[key]!==undefined ? Object.assign({}, w, {meaning:meaningOv[key]}) : w);
    }
  }
  for(const w of custom){
    if(!w || !w.word) continue;
    const key=w.word.toLowerCase();
    if(!seen.has(key)){
      seen.add(key);
      merged.push(meaningOv && meaningOv[key]!==undefined ? Object.assign({}, w, {meaning:meaningOv[key]}) : w);
    }
  }
  _vocabCache=merged; _vocabCacheSrc=VOCAB_DATA; _vocabCacheSrcLen=srcLen;
  _vocabCacheCustom=customVocab; _vocabCacheCustomLen=custom.length;
  _vocabByCategory=null;
  return merged;
}

function getWordHfCount(word){
  if(!word) return 0;
  const key=word.toLowerCase();
  if(progress && progress.hfOverrides && progress.hfOverrides[key] !== undefined){
    return progress.hfOverrides[key];
  }
  if(!_hfCountCache){
    _hfCountCache = new Map();
    if(Array.isArray(customVocab)){
      for(let i=0; i<customVocab.length; i++){
        const cv = customVocab[i];
        if(cv && cv.word && cv.hfCount) _hfCountCache.set(cv.word.toLowerCase(), cv.hfCount);
      }
    }
  }
  return _hfCountCache.get(key) || 0;
}

// ===== Text-to-Speech =====
let ttsVoice = null;
let ttsUnlocked = false;
let ttsAvailable = ('speechSynthesis' in window) && (typeof SpeechSynthesisUtterance !== 'undefined');
let _sharedAudio = null;

function loadTTSVoice(){
  if(!ttsAvailable) return;
  const voices = speechSynthesis.getVoices();
  if(voices.length===0) return;
  const usVoices = voices.filter(v=>v.lang==='en-US');
  if(usVoices.length>0){
    const preferred = usVoices.find(v=>/google|natural|samantha|aria|daniel|zira/i.test(v.name));
    ttsVoice = preferred || usVoices[0];
  } else if(voices.length>0){
    ttsVoice = voices.find(v=>v.lang.startsWith('en')) || voices[0];
  }
}

function unlockTTS(){
  if(ttsUnlocked || !ttsAvailable) return;
  ttsUnlocked = true;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance('');
    u.volume = 0; u.rate = 1; u.lang = 'en-US';
    speechSynthesis.speak(u);
  }catch(e){}
}

['touchstart','click','keydown'].forEach(evt=>{
  document.addEventListener(evt, unlockTTS, {once:true, passive:true});
});

function speakWord(word, btnEl){
  if(!word) return;
  if(ttsAvailable){
    try{ speechSynthesis.resume(); }catch(e){}
    try{ speechSynthesis.cancel(); }catch(e){}
    const utter = new SpeechSynthesisUtterance(word);
    utter.lang = 'en-US'; utter.rate = 0.95; utter.pitch = 1; utter.volume = 1;
    if(ttsVoice) utter.voice = ttsVoice;
    if(btnEl){
      btnEl.classList.add('speaking');
      utter.onend = ()=>{ btnEl.classList.remove('speaking'); };
      utter.onerror = ()=>{ btnEl.classList.remove('speaking'); speakOnline(word, btnEl); };
    }
    try{
      speechSynthesis.speak(utter);
    }catch(e){
      if(btnEl) btnEl.classList.remove('speaking');
      speakOnline(word, btnEl);
    }
    return;
  }
  speakOnline(word, btnEl);
}

function speakOnline(word, btnEl){
  try{
    if(!_sharedAudio){
      _sharedAudio = new Audio();
    }
    const url='https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(word)+'&type=2';
    if(btnEl){
      btnEl.classList.add('speaking');
      _sharedAudio.onended=()=>{ btnEl.classList.remove('speaking'); };
      _sharedAudio.onerror=()=>{ btnEl.classList.remove('speaking'); };
    }
    _sharedAudio.src = url;
    _sharedAudio.play().catch(()=>{ if(btnEl) btnEl.classList.remove('speaking'); });
  }catch(e){ if(btnEl) btnEl.classList.remove('speaking'); }
}

if(ttsAvailable){
  loadTTSVoice();
  speechSynthesis.onvoiceschanged = loadTTSVoice;
  let voiceRetryCount = 0;
  const voiceRetry = setInterval(()=>{
    voiceRetryCount++;
    if(ttsVoice || voiceRetryCount>=10){ clearInterval(voiceRetry); return; }
    loadTTSVoice();
  }, 500);
}

// ===== IndexedDB Storage =====
let dbInstance = null;

function initDB(){
  return new Promise((resolve)=>{
    if(!('indexedDB' in window)){ resolve(null); return; }
    try{
      const req = indexedDB.open('vocabDB2', 2);
      req.onupgradeneeded = (e)=>{
        const db = e.target.result;
        const tx = e.target.transaction;
        if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
      };
      req.onblocked = ()=>{
        // 其他标签页还占着旧版本时会阻塞升级。如果不在这里放行，
        // initApp 的 await initDB() 永远不返回 → 整页白屏。
        console.warn('[vocab] IndexedDB 升级被其他标签页阻塞，请关闭本应用的其他页面后刷新');
        try{ showToast('请关闭本应用的其他标签页后刷新'); }catch(e){}
        resolve(null);
      };
      req.onsuccess = (e)=>{ dbInstance = e.target.result; resolve(dbInstance); };
      req.onerror = ()=>{ resolve(null); };
    }catch(e){ resolve(null); }
  });
}

function dbSet(key, value){
  return new Promise((resolve)=>{
    if(!dbInstance){ resolve(false); return; }
    try{
      const tx = dbInstance.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(value, key);
      tx.oncomplete = ()=>{ resolve(true); };
      tx.onerror = ()=>{ resolve(false); };
    }catch(e){ resolve(false); }
  });
}

function dbGet(key){
  return new Promise((resolve)=>{
    if(!dbInstance){ resolve(null); return; }
    try{
      const tx = dbInstance.transaction('kv', 'readonly');
      const req = tx.objectStore('kv').get(key);
      req.onsuccess = ()=>{ resolve(req.result !== undefined ? req.result : null); };
      req.onerror = ()=>{ resolve(null); };
    }catch(e){ resolve(null); }
  });
}

function dbDelete(key){
  return new Promise((resolve)=>{
    if(!dbInstance){ resolve(false); return; }
    try{
      const tx = dbInstance.transaction('kv', 'readwrite');
      tx.objectStore('kv').delete(key);
      tx.oncomplete = ()=>{ resolve(true); };
      tx.onerror = ()=>{ resolve(false); };
    }catch(e){ resolve(false); }
  });
}

function getVocabStatusLabel(wp){
  if(!wp) return {text:'未学', cls:'new'};
  if(wp.status==='ignored') return {text:'已斩', cls:'ignored'};
  if(wp.status==='new') return {text:'未学', cls:'new'};
  if(wp.fsrsState==='Learning') return {text:'学习中', cls:'learning'};
  if(wp.fsrsState==='Review'){
    if(isWordMastered(wp)) return {text:'已掌握', cls:'mastered'};
    return {text:'复习中', cls:'review'};
  }
  if(wp.fsrsState==='Relearning') return {text:'重学中', cls:'relearning'};
  if(wp.status==='mastered') return {text:'已掌握', cls:'mastered'};
  if(wp.status==='review') return {text:'学习中', cls:'review'};
  return {text:'未知', cls:'new'};
}

function renderVocabListItems(){
  const filtered=getFilteredVocab();
  const listEl=document.getElementById('vocab-list');
  if(listEl){
    listEl.innerHTML=filtered.map(w=>{
      const wp=progress.words[w.word];

      return `<div class="vocab-item">

function getFilteredVocab(){
  const all=getAllVocab();
  let filtered=all;
  if(vocabFilter!=='all'){
    filtered=filtered.filter(w=>{
      const wp=progress.words[w.word];
      if(vocabFilter==='new') return !wp || wp.status==='new';
      if(vocabFilter==='ignored') return wp && wp.status==='ignored';
      if(vocabFilter==='mastered') return wp && isWordMastered(wp);
      if(vocabFilter==='learning') return wp && wp.fsrsState==='Learning';
      if(vocabFilter==='relearning') return wp && wp.fsrsState==='Relearning';
      if(vocabFilter==='review') return wp && wp.fsrsState==='Review' && !isWordMastered(wp);
      return wp && wp.status===vocabFilter;
    });
  }
  if(vocabSearch.trim()){
    const q=vocabSearch.trim().toLowerCase();
    filtered=filtered.filter(w=>
      w.word.toLowerCase().includes(q) ||
      (w.meaning||'').toLowerCase().includes(q)
    );
  }
  return filtered;
}

function buildVocabExcelData(words){
  const data=[['单词','词性','释义','分类','学习状态','稳定性','难度','正确次数','错误次数']];
  for(const w of words){
    const wp=progress.words[w.word];
    const st=getVocabStatusLabel(wp);
    data.push([
      w.word,
      w.type||'',
      w.meaning||'',
      w.category||'',
      st.text,
      wp?(wp.stability?wp.stability.toFixed(1)+'天':'-'):'-',
      wp?(wp.difficulty?wp.difficulty.toFixed(1):'-'):'-',
      wp?(wp.correct||0):0,
      wp?(wp.wrong||0):0
    ]);
  }
  return data;
}

// Merge customVocab into VOCAB_DATA so imported words become system vocabulary
function mergeCustomVocabToSystem(){
  if(!customVocab || customVocab.length===0) return;
  const existingWords=new Set(VOCAB_DATA.map(w=>w.word.toLowerCase()));
  for(const w of customVocab){
    if(!existingWords.has(w.word.toLowerCase())){
      VOCAB_DATA.push(w);
      existingWords.add(w.word.toLowerCase());
    }
  }
  invalidateVocabCache();
}

  }

      words:{},
      stats:{totalLearned:0,totalMastered:0,totalCorrect:0,totalWrong:0,streak:0,lastStudyDate:null,
             todayStudyMinutes:0,totalStudyMinutes:0,todayStudyDate:''}
    };
  }
  normalizeProgress();

// 进度归一化：loadProgress 和 loadProgressFromDB 共用，消除之前两份重复的 30 行代码
function normalizeProgress(){
  // V5 defaults
  if(progress.studyGoal===undefined || progress.studyGoal<100) progress.studyGoal=100;
  if(progress.studyGoal>400) progress.studyGoal=400;
  if(progress.reviewGoal===undefined) progress.reviewGoal=0; // 0=今日待复习量
  if(progress.reviewGoal===80) progress.reviewGoal=200;
  if(progress.todayDate!==getToday()){ progress.todayDate=getToday(); progress.todayNewCount=0; progress.todayReviewCount=0; }
  if(progress.todayReviewCount===undefined) progress.todayReviewCount=0;
  if(!progress.stats) progress.stats={};
  if(progress.stats.todayStudyMinutes===undefined) progress.stats.todayStudyMinutes=0;
  if(progress.stats.totalStudyMinutes===undefined) progress.stats.totalStudyMinutes=0;
  if(progress.stats.todayStudyDate===undefined) progress.stats.todayStudyDate='';
  // 每日学习时长与"学习日"对齐（北京时间 05:00 换日），不再单独按 0 点换日
  if(progress.stats.todayStudyDate!==getToday()){
    progress.stats.todayStudyDate=getToday();
    progress.stats.todayStudyMinutes=0;
  }
  // 艾宾浩斯调度器：迁移所有既有词汇状态为复习间隔字段
  if(progress.words){
    for(const w in progress.words){ migrateToEB(progress.words[w]); }
    // V5-EX5: Migrate firstLearned field (fix forced review using lastStudy bug)
    for(const w in progress.words){
      const wp=progress.words[w];
      if(wp.firstLearned===undefined){
        wp.firstLearned = wp.lastStudy || wp.lastReview || Date.now();
      }
    }
    // V5-EX7: Nuclear fix — reset ALL firstLearned to 3 days ago
    // V5-EX6 (total>4 check) failed because migrated words have correct=0, wrong=0
    // Can't distinguish contaminated vs real firstLearned, so reset everything
    // New words studied from now on get correct firstLearned from completeSession()
    if(!progress.firstLearnedFixV3){
      for(const w in progress.words){
        const wp=progress.words[w];
        if(wp.firstLearned){
          wp.firstLearned=Date.now()-3*86400000;
        }
      }
      progress.firstLearnedFixV3=true;
      progress.firstLearnedFixV2=true; // Mark old fix as done too
    }
  }
}

// ===== 写入合并 =====
// 评分、切卡会在很短时间内多次触发保存。合并成一次写入，避免每张卡都做
// 多次 JSON.stringify + 同步 localStorage 写入阻塞主线程。
// flushPersistence 会在页面隐藏/卸载前强制落盘。
const PERSIST_DELAY=1000;
let _persistTimer=null, _progressDirty=false, _sessionDirty=false;

function flushPersistence(forceSync){
  if(_persistTimer){ clearTimeout(_persistTimer); _persistTimer=null; }
  if(_sessionDirty){ _sessionDirty=false; writeSessionNow(forceSync); }
  if(_progressDirty){ _progressDirty=false; writeProgressNow(forceSync); }
}

// 丢弃挂起的写入。删除/切换用户这类操作必须先调用，
// 否则定时器会把刚删掉的数据又写回来（或写到切换后的用户名下）
function cancelPendingWrites(){
  if(_persistTimer){ clearTimeout(_persistTimer); _persistTimer=null; }
  _progressDirty=false; _sessionDirty=false;
}

function schedulePersist(){
  if(_persistTimer) return;
  _persistTimer=setTimeout(flushPersistence, PERSIST_DELAY);
}

function saveProgress(){ _progressDirty=true; schedulePersist(); }
function saveSession(){ _sessionDirty=true; schedulePersist(); }

function writeProgressNow(forceSync){
  if(!progress) return;
  const doWrite = () => {
    try{
      const key = getStorageKey('vocabProgress');
      if(storageAvailable){ try{ localStorage.setItem(key, JSON.stringify(progress)); }catch(e){} }
      if(dbInstance){ dbSet(key, progress); }
    }catch(e){}
  };
  // 平时用空闲回调把大 JSON 的写盘推迟到浏览器空闲时，避免卡顿。
  // 但页面隐藏/卸载时的强制落盘必须同步执行：那一刻 idle 回调通常不会再跑，
  // 而 _progressDirty 已经清空 → 这次进度会被静默丢掉。
  if(!forceSync && typeof window !== 'undefined' && 'requestIdleCallback' in window){
    window.requestIdleCallback(doWrite, {timeout: 800});
  } else {
    doWrite();
  }
}

// ===== Session Persistence =====
function writeSessionNow(forceSync){
  if(!storageAvailable && !dbInstance) return;
  if(!session){
    if(storageAvailable){ try{ localStorage.removeItem(getStorageKey('vocabSession')); }catch(e){} }
    if(dbInstance){ dbDelete(getStorageKey('vocabSession')); }
    return;
  }
  const doWrite = () => {
    try{
      // 只保存从 currentIndex 起的剩余卡片：已做完的卡对恢复无意义，
      // 裁掉后序列化体积从几百张降到几十张，JSON.stringify 不再卡主线程。
      // 同时保存 totalCardCount / savedIndex，恢复后进度显示仍准确。
      const remainingCards = session.cards.slice(session.currentIndex);
      const s={
        type:session.type, cards:remainingCards, currentIndex:0,
        totalCardCount:session.cards.length,
        savedIndex:session.currentIndex,
        correctCount:session.correctCount, wrongCount:session.wrongCount,
        studiedWords:session.studiedWords?[...session.studiedWords]:[],
        retestQueue:session.retestQueue||[],
        retestInserted:session.retestInserted?[...session.retestInserted]:[],
        answeredWords:session.answeredWords?[...session.answeredWords]:[],
        reviewResults:session.reviewResults||{},
        wordCorrectCount:session.wordCorrectCount||{},
        isWrongPractice:session.isWrongPractice||false,
        isAutoReview:session.isAutoReview||false,
        startTime:session.startTime||Date.now(),
        accumulatedTime:session.accumulatedTime||0,
        lastActiveTime:Date.now()
      };
      const key=getStorageKey('vocabSession');
      if(storageAvailable){ try{ localStorage.setItem(key,JSON.stringify(s)); }catch(e){} }
      if(dbInstance){ dbSet(key, s); }
    }catch(e){}
  };
  // 非强制落盘走 idle 回调：JSON.stringify 大 session + localStorage.setItem
  // 会阻塞主线程几十毫秒，这就是答题后周期性卡顿的根源。
  // 页面隐藏/卸载时 forceSync=true 必须同步写，否则 idle 回调来不及跑数据会丢。
  if(!forceSync && typeof window !== 'undefined' && 'requestIdleCallback' in window){
    window.requestIdleCallback(doWrite, {timeout: 800});
  } else {
    doWrite();
  }
}

// ===== Word Queries =====
function getNewWords(count){
  const all=getAllVocab();
  return all.filter(w=>{
    const wp=progress.words[w.word];
    return !wp || wp.status==='new';
  }).slice(0,count);
}

// 学习日起止：与 getToday()/dateToStudyDay() 完全一致，均以北京时间 05:00 为界。
// 之前这里用的是北京时间 0 点，导致 0:00–5:00 之间"今日待复习"与
// "今日新学 / 连续天数 / 今日时长"的跨日口径不一致。
function getTodayStart(){
  const now=new Date();
  const b=new Date(now.getTime()+8*3600000);
  if(b.getUTCHours()<5) b.setUTCDate(b.getUTCDate()-1);
  return Date.UTC(b.getUTCFullYear(), b.getUTCMonth(), b.getUTCDate(), 5, 0, 0, 0)-8*3600000;
}
function getTodayEnd(){ return getTodayStart()+86400000; }

function getMasteredCount(){
  // 艾宾浩斯已掌握标准：state === Review 且 stability >= 20天
  let count=0;
  for(const w in progress.words){
    if(isWordMastered(progress.words[w])) count++;
  }
  return count;
}
// 与 getAllVocab() 取交集：progress.words 里可能残留词库中已不存在的词
// （例如换了词库/导入了别人的进度），直接按 progress.words 计数会让
// "已学 + 已斩" 超过词库总数，总进度条随之冲到 100% 以上
function getIgnoredCount(){
  let count=0;
  for(const w of getAllVocab()){ const wp=progress.words[w.word]; if(wp && wp.status==='ignored') count++; }
  return count;
}
function getLearnedCount(){
  let count=0;
  for(const w of getAllVocab()){ const wp=progress.words[w.word]; if(wp && wp.status!=='new' && wp.status!=='ignored') count++; }
  return count;
}

function getWrongWords(){
  const all=getAllVocab();
  return all.filter(w=>{
    const wp=progress.words[w.word];
    return wp && wp.status!=='ignored' && (wp.wrong||0)>=3;
  });
}

// V5-EX4: Independent review - due words first, then fill by retrievability
function getAutoReviewWords(){
  const all=getAllVocab();
  // Include ALL learned words (including mastered) for independent review, but NOT ignored
  const learnedWords = all.filter(w=>{
    const wp=progress.words[w.word];
    return wp && wp.status!=='new' && wp.status!=='ignored';
  });

  if(learnedWords.length===0) return [];

  const isDefaultMode = progress.reviewGoal===0;
  const dueCutoff = Date.now();

  // 1. 先构建 dueCandidates(同时用于默认模式的 dueNow 计数和实际选词)
  //    retrievability 惰性计算：它要构造 FSRS card 并调调度器，开销远大于存引用。
  //    到期词排序以 nextReview 为主，只有到期时间接近(1小时内)时才用得上它。
  const dueCandidates = [];
  for(let i=0; i<learnedWords.length; i++){
    const w = learnedWords[i];
    const wp = progress.words[w.word];
    if(wp && wp.nextReview && wp.nextReview<=dueCutoff){
      dueCandidates.push({
        word: w,
        wp: wp,
        nextReview: wp.nextReview || 0,
        wrong: wp.wrong || 0
      });
    }
  }
  const dueNow = dueCandidates.length; // 复用,不再单独 filter 遍历

  let targetCount;
  if(isDefaultMode){
    // 默认模式：取全部当前到期词(dueNow)，复习完后 nextReview 自然推到未来。
    // 不再用 todayReviewCount 缓存当天首次总量——首页已改为实时计算，
    // 这里若继续用旧缓存会与首页数字不一致（首页643、进去21）。
    targetCount = dueNow;
  } else {
    targetCount = progress.reviewGoal;
  }
  const takeCount = Math.min(targetCount, learnedWords.length);
  const selectedSet = new Set();
  const result = [];

  // Sort due words: overdue first (most expired first), then by retrievability
  dueCandidates.sort((a,b)=>{
    const expireDiff = a.nextReview - b.nextReview;
    if(Math.abs(expireDiff)>3600000) return expireDiff;
    // 到期时间接近(<=1 小时)时细化：
    // 1) 选错过的词(lapses/wrong 多)优先——"选错的，下次优先"；
    // 2) 再看记忆强度，弱的多掉(低 retrievability)的先复习；
    if(a.wrong !== b.wrong) return b.wrong - a.wrong;
    // 仅在此刻才计算记忆强度
    if(a.r===undefined) a.r=fsrsRetrievability(a.wp);
    if(b.r===undefined) b.r=fsrsRetrievability(b.wp);
    const rDiff = a.r - b.r;
    if(Math.abs(rDiff)>0.01) return rDiff;
    return b.wrong - a.wrong;
  });

  for(let i=0; i<dueCandidates.length; i++){
    if(result.length>=takeCount) break;
    const item = dueCandidates[i].word;
    if(!selectedSet.has(item.word)){
      selectedSet.add(item.word);
      result.push(item);
    }
  }

  // 2. Fill remaining with non-due learned words, sorted by retrievability
  if(!isDefaultMode && result.length<takeCount){
    const remainingCandidates = [];
    for(let i=0; i<learnedWords.length; i++){
      const w = learnedWords[i];
      if(!selectedSet.has(w.word)){
        const wp = progress.words[w.word] || {};
        // 自定义模式是"每次"取满 reviewGoal,不排除今天已复习的已掌握词
        // retrievability 同样惰性：已掌握词在排序里根本不读它
        remainingCandidates.push({
          word: w,
          wp: wp,
          wrong: wp.wrong || 0,
          mastered: isWordMastered(wp)
        });
      }
    }
    // 自定义模式排序:已掌握词优先(wrong>0 优先,然后随机),非已掌握按 retrievability
    // 先打乱,让已掌握词内的排序是随机的(同组内 tiebreaker 用打乱后的顺序)
    const shuffledCandidates = shuffle(remainingCandidates);
    shuffledCandidates.sort((a,b)=>{
      // 已掌握词优先于非已掌握
      if(a.mastered !== b.mastered) return (b.mastered?1:0) - (a.mastered?1:0);
      if(a.mastered){
        // 已掌握内:wrong>0 优先,其余保持打乱顺序(随机)
        const aWrong = a.wrong>0 ? 1 : 0;
        const bWrong = b.wrong>0 ? 1 : 0;
        if(aWrong !== bWrong) return bWrong - aWrong;
        return 0; // 保持打乱后的随机顺序
      }
      // 非已掌握:按 retrievability 升序(低记忆强度先复习)
      if(a.r===undefined) a.r=fsrsRetrievability(a.wp);
      if(b.r===undefined) b.r=fsrsRetrievability(b.wp);
      const rDiff = a.r - b.r;
      if(Math.abs(rDiff)>0.01) return rDiff;
      return b.wrong - a.wrong;
    });
    for(let i=0; i<shuffledCandidates.length; i++){
      if(result.length>=takeCount) break;
      const item = shuffledCandidates[i].word;
      selectedSet.add(item.word);
      result.push(item);
    }
  }

  // 3. V6-EX: 默认模式下补充已掌握词随机复习(防遗忘),优先第一次答错的
  //    用户需求:考前 80 天持续复习,随时点都有词,稳定性高的已掌握词也要重复
  //    两级池:优先今天还没复习过的已掌握词;当它们都被过完一轮后,
  //    降级为"今天已复习过的也能再抽",保证任何时候点"开始复习"都拿得到词
  //    (否则过完一轮就提示"暂无可复习的单词",与"随时重复"的需求冲突)
  //    自定义模式:第 2 步已按 已掌握优先+wrong>0 填满 reviewGoal,不额外补充
  if(isDefaultMode){
    const todayStart = getTodayStart();
    const freshPool = [], recycledPool = [];
    for(let i=0; i<learnedWords.length; i++){
      const w = learnedWords[i];
      if(selectedSet.has(w.word)) continue;
      const wp = progress.words[w.word];
      if(!wp || !isWordMastered(wp)) continue;
      const item = { word: w, wrong: wp.wrong || 0 };
      if(wp.lastReview && wp.lastReview >= todayStart) recycledPool.push(item);
      else freshPool.push(item);
    }
    const masteredPool = freshPool.length > 0 ? freshPool : recycledPool;
    if(masteredPool.length > 0){
      // 补充量:已掌握词的 5%,最少 5 个,最多 20 个
      const masteredQuota = Math.min(20, Math.max(5, Math.ceil(masteredPool.length * 0.05)));
      // 优先第一次答错的(wrong > 0),其余次之,各自随机
      const wrongFirst = shuffle(masteredPool.filter(c => c.wrong > 0));
      const noWrong = shuffle(masteredPool.filter(c => c.wrong === 0));
      const ordered = [...wrongFirst, ...noWrong];
      for(let i=0; i<ordered.length && i<masteredQuota; i++){
        const item = ordered[i].word;
        selectedSet.add(item.word);
        result.push(item);
      }
    }
  }

  return shuffle(result);
}

// 主页统计合并计算：一次性遍历 getAllVocab() 得到所有主页需要的计数
// 之前 renderHome 调用 9 个独立统计函数,每个都遍历全词库,共 9 次遍历
// 这里合并为 1 次遍历 + 1 次 getMasteredCount()(数据源不同,无法合并)
function computeHomeStats(){
  const todayStart=getTodayStart();
  const now=Date.now();
  const all=getAllVocab();
  const words=progress.words;
  let dueCount=0, overdueCount=0, newCount=0, learnedCount=0, ignoredCount=0, wrongCount=0;
  let masteredFresh=0, masteredRecycled=0;
  for(let i=0; i<all.length; i++){
    const w=all[i];
    const wp=words[w.word];
    const status = wp ? wp.status : 'new';
    // 新词计数(!wp OR status==='new')
    if(!wp || status==='new'){ newCount++; continue; }
    // 已斩计数
    if(status==='ignored'){ ignoredCount++; continue; }
    // 已学计数(status==='review' 或其他非 new/ignored)
    learnedCount++;
    // 今日待复习:只统计当前已到期的词(nextReview <= now)。
    // 必须与 getAutoReviewWords 的 dueNow 口径一致,否则首页显示数量
    // 会远大于实际能复习的数量(把今天晚些时候才到期的词也算进去了)。
    // overdueCount 单独统计 nextReview < todayStart 的逾期词,
    // dueCount + overdueCount = nextReview <= now,与 dueNow 完全对齐。
    if(wp.nextReview && wp.nextReview>=todayStart && wp.nextReview<=now){
      dueCount++;
    }
    // 累积逾期:nextReview < todayStart
    if(wp.nextReview && wp.nextReview<todayStart){
      overdueCount++;
    }
    // 错题本:wrong>=3(已排除 ignored)
    if((wp.wrong||0)>=3) wrongCount++;
    // 已掌握词补充复习候选:优先今天没复习过的;都被过完一轮后降级为可重复复习
    // (与 getAutoReviewWords 第 3 步的两级池口径保持一致)
    // 补充基数必须排除"已到期"的已掌握词:它们会走 due 通道被选中,
    // 若计入则主页 supplementCount 会大于实际能补到的词数(之前对不上账的根因)。
    if(isWordMastered(wp) && wp.nextReview && wp.nextReview>now){
      if(!wp.lastReview || wp.lastReview<todayStart) masteredFresh++;
      else masteredRecycled++;
    }
  }
  const masteredAvailable = masteredFresh>0 ? masteredFresh : masteredRecycled;
  // 补充量只在确有未到期已掌握词时按下限 5~20 计算；基数 0 时必须是 0，
  // 否则主页会凭空多出 5 个(实际抽词时没得补,又对不上账)
  let supplementCount = 0;
  if(progress.reviewGoal===0 && masteredAvailable>0){
    supplementCount=Math.min(20, Math.max(5, Math.ceil(masteredAvailable*0.05)));
  }
  return {
    all, totalCount: all.length,
    dueCount, overdueCount, newCount, learnedCount, ignoredCount, wrongCount,
    masteredCount: getMasteredCount(), // 遍历 progress.words,数据源不同
    supplementCount
  };
}

// ===== Generate Options (High-Performance O(1) Sampler) =====
function generateOptions(card){
  const isCn2En = card.passType==='cn2en';
  const correctVal = isCn2En ? card.word : card.meaning;
  const correctLen = correctVal.length;
  const targetFirstChar = correctVal[0] ? correctVal[0].toLowerCase() : '';

  const catMap = getVocabCategoryMap();
  const sameCatList = (catMap.get(card.category) || []);
  const allVocab = getAllVocab();

  // Fast score function
  const scoreWord = (w)=>{
    const val = isCn2En ? w.word : w.meaning;
    if(!val) return -999;
    let score = -Math.abs(val.length - correctLen);
    if(targetFirstChar && val[0] && val[0].toLowerCase()===targetFirstChar) score += 5;
    return score;
  };

  // Sample up to 30 from same category, avoiding entire 4k scans
  const sampleCandidates = [];
  const pickedIndices = new Set();
  const sameLen = sameCatList.length;
  const sampleSameCount = Math.min(30, sameLen);
  for(let i=0; i<sampleSameCount; i++){
    const idx = (Math.random() * sameLen) | 0;
    if(!pickedIndices.has(idx)){
      pickedIndices.add(idx);
      const w = sameCatList[idx];
      if(w && w.word !== card.word) sampleCandidates.push(w);
    }
  }

  // Sample up to 25 from general vocab for fallback
  const totalVocabLen = allVocab.length;
  const sampleOtherCount = Math.min(25, totalVocabLen);
  for(let i=0; i<sampleOtherCount; i++){
    const idx = (Math.random() * totalVocabLen) | 0;
    const w = allVocab[idx];
    if(w && w.word !== card.word) sampleCandidates.push(w);
  }

  // Score candidate slice
  sampleCandidates.sort((a,b)=>scoreWord(b) - scoreWord(a));

  const options = [correctVal];
  const optionWords = [card];
  const seenVals = new Set([correctVal.toLowerCase()]);

  for(let i=0; i<sampleCandidates.length; i++){
    if(options.length>=4) break;
    const w = sampleCandidates[i];
    const val = isCn2En ? w.word : w.meaning;
    if(val && !seenVals.has(val.toLowerCase())){
      options.push(val);
      optionWords.push(w);
      seenVals.add(val.toLowerCase());
    }
  }

  // Guaranteed fallback to 4 options
  let fallbackIdx = 0;
  while(options.length<4 && fallbackIdx<allVocab.length){
    const w = allVocab[fallbackIdx++];
    if(w && w.word !== card.word){
      const val = isCn2En ? w.word : w.meaning;
      if(val && !seenVals.has(val.toLowerCase())){
        options.push(val);
        optionWords.push(w);
        seenVals.add(val.toLowerCase());
      }
    }
  }
  while(options.length<4){
    options.push(options[0]);
    optionWords.push(optionWords[0]);
  }

  const shuffled = shuffle(options.map((v,i)=>({val:v, word:optionWords[i]})));
  return {options: shuffled.map(x=>x.val), optionWords: shuffled.map(x=>x.word)};
}

function handleImportFile(input){
  const file=input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=new Uint8Array(e.target.result);
      const wb=XLSX.read(data,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1});

    }catch(err){

    }

// 词语义合并：词已存在但释义没重复时，把新释义合并进该词的 meaning。
// 拆分用 ；/; 分隔，逐条去重（不区分大小写）；新增的意思插到最前面，
// 这样背诵/复习展示释义时新添加的意思优先出现在最前。
function mergeMeaning(existing, incoming){
  const split=function(s){
    return String(s||'').split(/[；;]/).map(function(x){ return x.trim(); }).filter(Boolean);
  };
  const parts=split(existing);
  const inParts=split(incoming);
  let added=0;
  for(const p of inParts){
    const i=parts.findIndex(function(q){ return q.toLowerCase()===p.toLowerCase(); });
    if(i===-1){ parts.unshift(p); added++; }
  }
  return { merged:parts.join('；'), added };
}

function parseImportRows(rows){
  if(rows.length<2){ showToast('文件内容为空'); return; }
  const header=rows[0].map(h=>String(h||'').trim().toLowerCase());
  let wordCol=-1, meaningCol=-1, typeCol=-1, catCol=-1;
  let startRow=0;

  for(let i=0;i<header.length;i++){
    const h=header[i];
    if(/^(词汇|单词|word|phrase|词汇\/短语|单词\/短语)$/.test(h)) wordCol=i;
    else if(/^(释义|中文|meaning|中文释义|原文语境释义|释义\/翻译)$/.test(h)) meaningCol=i;
    else if(/^(类型|词性|type|词性\/类型)$/.test(h)) typeCol=i;
    else if(/^(category|分类|类别)$/.test(h)) catCol=i;
  }

  if(wordCol===-1 || meaningCol===-1){
    const firstRow=rows[0].map(h=>String(h||'').trim().toLowerCase());
    const hasHeader=firstRow.some(h=>/^(序号|词汇|单词|word|类型|词性)/.test(h));
    if(hasHeader){ startRow=1; }
    if(wordCol===-1) wordCol=0;
    if(meaningCol===-1) meaningCol=1;
    if(typeCol===-1 && header.length>2) typeCol=2;
  } else { startRow=1; }

  pendingImportData=[];
  for(let i=startRow;i<rows.length;i++){
    const row=rows[i];
    if(!row) continue;
    const word=String(row[wordCol]||'').trim();
    const meaning=String(row[meaningCol]||'').trim();
    if(!word || word==='undefined' || !meaning || meaning==='undefined') continue;
    const type=typeCol>=0?String(row[typeCol]||'核心词').trim():'核心词';
    const category=catCol>=0?String(row[catCol]||type).trim():type;
    pendingImportData.push({word, type, meaning, category});
  }

  if(pendingImportData.length===0){ showToast('未找到有效词汇数据'); return; }

  const allExisting=getAllVocab();
  const existingMap={};
  for(const w of allExisting){ existingMap[w.word.toLowerCase()]=(existingMap[w.word.toLowerCase()]||0)+1; }
  const batchCounts={};
  for(const w of pendingImportData){ batchCounts[w.word.toLowerCase()]=(batchCounts[w.word.toLowerCase()]||0)+1; }

  const HF_THRESHOLD=3;
  const newWords=[], dupWords=[], hfWords=[];
  const seenInNew=new Set();

  for(const w of pendingImportData){
    const key=w.word.toLowerCase();
    const existingCount=existingMap[key]||0;
    const batchCount=batchCounts[key]||1;
    // 高频计数与 confirmImport 保持一致：按历史累计出现次数 + 本批次次数
    const totalCount=getWordHfCount(w.word)+batchCount;
    if(existingCount>0){
      if(!seenInNew.has(key)){
        // 判断该重复词是否带"未出现过的新释义"（需要合并）
        const ex=allExisting.find(function(x){ return x && x.word && x.word.toLowerCase()===key; });
        const willMerge = ex ? mergeMeaning(ex.meaning, w.meaning).added>0 : false;
        dupWords.push({word:w.word, meaning:w.meaning, count:totalCount, willMerge:willMerge});
        seenInNew.add(key);
        if(totalCount>=HF_THRESHOLD) hfWords.push({word:w.word, meaning:w.meaning, count:totalCount});
      }
    } else {
      // 同一批次内重复的新词只统计/展示一次（与 confirmImport 的实际写入一致）
      if(!seenInNew.has(key)){ newWords.push(w); seenInNew.add(key); }
    }
  }

  const previewEl=document.getElementById('import-preview');
  previewEl.style.display='block';
  let html='<div style="font-size:13px;font-weight:600;margin-bottom:8px">预览（前10条新词）：</div>';
  html += newWords.slice(0,10).map(w=>
    `<div class="import-preview-row"><span class="import-preview-word">${w.word}</span><span>${w.meaning}</span></div>`
  ).join('');
  html += `<div class="import-stats import-stats-new">新增词汇：${newWords.length} 个</div>`;
  if(dupWords.length>0){
    html += `<div class="import-stats import-stats-dup">重复词汇：${dupWords.length} 个（已存在词库中）`;
    if(hfWords.length>0){
      html += `<br>其中 <b>${hfWords.length}</b> 个为高频词（出现≥${HF_THRESHOLD}次），背诵时将重点提醒`;
    }
    html += '</div>';
    html += '<div style="margin-top:8px;font-size:12px;font-weight:600;color:var(--on-surface-variant)">重复词汇详情：</div>';
    html += dupWords.map(d=>{
      const isHF=d.count>=HF_THRESHOLD;
      return `<div class="import-dup-row">
        <span class="import-dup-word">${d.word}</span>
        <span style="flex:1;margin:0 8px;font-size:12px;color:var(--on-surface-variant);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d.meaning}</span>
        ${d.willMerge?'<span style="flex-shrink:0;font-size:11px;color:var(--success)">↻合并新释义</span>':''}
        <span class="import-dup-count">${isHF?'高频 ':''}×${d.count}</span>
      </div>`;
    }).join('');
  }
  html += `<div style="padding:8px 12px;font-size:12px;color:var(--on-surface-variant)">共 ${pendingImportData.length} 条数据</div>`;
  previewEl.innerHTML=html;
  document.getElementById('import-confirm-btn').disabled=false;
}

function confirmImport(){
  if(pendingImportData.length===0) return;
  const allExisting=getAllVocab();
  const batchCounts={};
  for(const w of pendingImportData){ batchCounts[w.word.toLowerCase()]=(batchCounts[w.word.toLowerCase()]||0)+1; }
  const HF_THRESHOLD=3;
  const existingWords=new Set(allExisting.map(w=>w.word.toLowerCase()));
  let added=0, skipped=0, hfMarked=0, mergedCount=0;

  // 同一批次里同一个词可能出现在多行，必须按"唯一的词"处理一次，
  // 否则 accumulated 会在循环里被反复叠加（3 行会算成 9 次）
  const processed=new Set();
  for(const w of pendingImportData){
    const key=w.word.toLowerCase();
    if(processed.has(key)) continue;
    processed.add(key);
    const batchCount=batchCounts[key]||1;
    // 高频计数必须跨批次累加：旧实现用"词库里是否存在"(恒为 0/1)+本批次次数，
    // 于是同一单词分 3 次各导入 1 遍也永远到不了阈值 3，永远标不成高频词
    const prior=getWordHfCount(w.word);
    const accumulated=prior+batchCount;
    const newlyHf=prior<HF_THRESHOLD && accumulated>=HF_THRESHOLD;
    if(!existingWords.has(key)){
      const entry={...w, hfCount:accumulated};
      if(newlyHf) hfMarked++;
      customVocab.push(entry);
      VOCAB_DATA.push(entry);  // Also add to system vocabulary
      existingWords.add(key);
      added++;
    } else {
      if(newlyHf) hfMarked++;
      const cv=customVocab.find(c=>c.word.toLowerCase()===key);
      if(cv){ cv.hfCount=accumulated; }
      else {
        if(!progress) progress={};
        if(!progress.hfOverrides) progress.hfOverrides={};
        progress.hfOverrides[key]=accumulated;
      }
      // 词已存在但释义没重复：把新释义合并进去（新意思插到最前，背诵复习时优先展示）。
      // 基准释义优先取历史合并结果（meaningOverrides），避免多次导入重复叠加。
      const baseMeaning = (progress.meaningOverrides && progress.meaningOverrides[key]) ||
        (cv ? cv.meaning : '') ||
        (VOCAB_DATA.find(function(x){ return x.word.toLowerCase()===key; }) || {}).meaning || '';
      const mm=mergeMeaning(baseMeaning, w.meaning);
      if(mm.added>0){
        if(!progress.meaningOverrides) progress.meaningOverrides={};
        progress.meaningOverrides[key]=mm.merged;
        for(const x of VOCAB_DATA){
          if(x.word.toLowerCase()===key){ x.meaning=mm.merged; }
        }
        if(cv) cv.meaning=mm.merged;
        mergedCount++;
      }
      skipped++;
    }
  }
  invalidateVocabCache();
  saveCustomVocab();
  if(progress && (progress.hfOverrides || mergedCount>0)) saveProgress();
  closeImportModal();
  let msg=`导入成功！新增 ${added} 词`;
  if(mergedCount>0) msg+=`，合并新释义 ${mergedCount} 词`;
  if(skipped>0) msg+=`，去重 ${skipped} 词`;
  if(hfMarked>0) msg+=`，标记 ${hfMarked} 个高频词`;
  showToast(msg);
  renderHome();
}

// ===== Home =====
function renderHome(){
  // 顶部归一化：合并多个独立 if + saveProgress 为一次标记 + 一次写入
  let goalDirty=false;
  if(!progress.studyGoal || progress.studyGoal < 100){ progress.studyGoal = 100; goalDirty=true; }
  if(progress.studyGoal > 400){ progress.studyGoal = 400; goalDirty=true; }
  if(progress.reviewGoal === 80){ progress.reviewGoal = 200; goalDirty=true; }
  if(goalDirty) saveProgress();

  // 一次性遍历 getAllVocab() 计算所有主页统计(替代之前 9 次独立遍历)
  const stats = computeHomeStats();
  const totalCount=stats.totalCount;
  const dueCount=stats.dueCount;
  const overdueCount=stats.overdueCount;
  const newCount=stats.newCount;
  const learnedCount=stats.learnedCount;
  const masteredCount=stats.masteredCount;
  const ignoredCount=stats.ignoredCount;
  const wrongCount=stats.wrongCount;
  const perSession=progress.studyGoal;
  const canStudy = newCount > 0;

  const progressDone=learnedCount+ignoredCount;
  // 兜底：即使计数口径异常，也不让进度条超过 100% / 出现 NaN
  const overallPct=totalCount>0?Math.min(progressDone/totalCount*100,100):0;
  // 待复习数 = 当前真正到期(due + 逾期) + 已掌握词补充。
  // 不再用 todayReviewCount 缓存"当日首次总量"——它与 getAutoReviewWords
  // 里的缓存互相覆盖、污染，导致首页显示 643 实际只有 21 的不一致。
  // 直接实时计算，与点"开始复习"后实际拿到的卡片数完全一致。
  const pendingReviewCount = Math.min(dueCount + overdueCount, learnedCount) + stats.supplementCount;

  const streak=progress.stats.streak||0;
  const todayMin=progress.stats.todayStudyMinutes||0;
  const totalMin=progress.stats.totalStudyMinutes||0;
  // V5: word count options
  const studyOptions=[100,150,200,300,400];
  const reviewOptions=[{v:0,l:'今日'},{v:200,l:'200'},{v:350,l:'350'},{v:500,l:'500'}];
  const learnedTotal=learnedCount; // 复用上面已经算好的值,不再重复遍历

  const pendingSession=loadSession()||_cachedPendingSession;
  _cachedPendingSession=null;
  let resumeHtml='';
  if(pendingSession && pendingSession.cards && pendingSession.currentIndex<pendingSession.cards.length){
    const total=pendingSession.totalCardCount || pendingSession.cards.length;
    const idx=(pendingSession.savedIndex || 0)+pendingSession.currentIndex+1;
    const typeLabel=pendingSession.type==='study'?'学习':(pendingSession.type==='review'?'复习':(pendingSession.type==='auto'?'自主复习':'错题本'));
    // 旧版会话没有 savedIndex，此时 currentIndex 就是已做到的位置
    const donePos=pendingSession.savedIndex!==undefined?pendingSession.savedIndex:pendingSession.currentIndex;
    const progressPct=Math.round(donePos/total*100);
    resumeHtml=`
      <div class="resume-banner">
        <div class="resume-banner-title">有未完成的${typeLabel}</div>
        <div class="resume-banner-desc">进度：${idx} / ${total}（${progressPct}%）</div>
        <div class="resume-banner-actions">
          <button class="resume-btn-primary" onclick="resumeSession()">继续学习</button>
          <button class="resume-btn-secondary" onclick="discardSession()">放弃</button>
        </div>
      </div>`;
  }

  const isStudy = homeMode==='study';
  const reviewCount = progress.reviewGoal===0 ? pendingReviewCount : Math.min(progress.reviewGoal, learnedTotal);
  const heroNum = isStudy ? progress.studyGoal : reviewCount;
  const heroLabel = isStudy
    ? `待学新词 · 词库剩余 ${newCount}`
    : (progress.reviewGoal===0 ? `今日到期待复习` : `自主复习目标 · 总已学 ${learnedTotal}`);
  const startBtnText = isStudy
    ? (newCount===0 ? '全部单词已学完' : `开始背词 (${Math.min(perSession,newCount)} 词)`)
    : (learnedTotal>0 ? `开始复习 (${reviewCount} 词)` : '暂无可复习的单词');
  const startBtnDisabled = isStudy ? !canStudy : learnedTotal===0;
  const overallPctRounded = Math.round(overallPct);

  const html=`
    <div class="home-new">
      <!-- 顶栏 -->
      <header class="hn-topbar">
        <div>
          <span class="hn-title">考研英语核心词</span>
          <span class="hn-streak">第 ${streak} 天</span>
        </div>
        <button class="hn-icon-btn" onclick="hnToggleMenu(true)">•••</button>
      </header>

      ${resumeHtml ? `<div class="hn-resume">${resumeHtml.replace('class="resume-banner"','class=""').replace('class="resume-banner-title"','class="hn-resume-title"').replace('class="resume-banner-desc"','class="hn-resume-desc"').replace('class="resume-banner-actions"','class="hn-resume-actions"').replace('class="resume-btn-primary"','class="hn-resume-btn-primary"').replace('class="resume-btn-secondary"','class="hn-resume-btn-secondary"')}</div>` : ''}

      <!-- 核心焦点 -->
      <main class="hn-focus">
        <div class="hn-mode-switch">
          <span class="hn-mode-item ${isStudy?'active':''}" onclick="setHomeMode('study')">背新词</span>
          <span class="hn-mode-item ${!isStudy?'active':''}" onclick="setHomeMode('review')">复习</span>
        </div>
        <div class="hn-hero-num">${heroNum}</div>
        <div class="hn-hero-label">${heroLabel}</div>
        <div class="hn-progress-line"><div class="hn-progress-fill" style="width:${overallPctRounded}%"></div></div>

// ===== Data Export/Import =====
function exportData(){
  const exportObj={...progress, _user:currentUser, _exportDate:getToday(), _customVocab:customVocab};
  const dataStr=JSON.stringify(exportObj);
  const blob=new Blob([dataStr],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='背单词进度_'+(currentUser||'')+'_'+getToday()+'.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('进度已导出');
}

function importData(){
  const input=document.createElement('input');
  input.type='file'; input.accept='.json,application/json';
  input.onchange=function(e){
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=function(){
      try{
        const data=JSON.parse(reader.result);
        if(!data.words || !data.stats){ showToast('文件格式不正确'); return; }
        showAppConfirm({
          title: '导入覆盖进度',
          message: '确定导入此进度文件吗？将覆盖当前用户的学习进度。',
          icon: '📥',
          confirmText: '确定导入',
          cancelText: '取消',
          isDanger: true,
          onConfirm: () => {
            const importedCustomVocab=data._customVocab||[];
            delete data._user; delete data._exportDate; delete data._customVocab;
            progress=data;
            if(progress.studyGoal===undefined || progress.studyGoal<100) progress.studyGoal=100; if(progress.studyGoal>400) progress.studyGoal=400;
            if(progress.reviewGoal===undefined) progress.reviewGoal=0;
            if(!progress.stats) progress.stats={};
            // 归一化"今日"计数：导入文件的 todayDate 通常不是今天，
            // 不重置会让今日学习进度错乱（例如出现"今日新词已学完"假死）
            if(progress.todayDate!==getToday()){
              progress.todayDate=getToday();
              progress.todayNewCount=0;
              progress.todayReviewCount=0;
            }
            if(progress.todayNewCount===undefined) progress.todayNewCount=0;
            if(progress.todayReviewCount===undefined) progress.todayReviewCount=0;
            // 艾宾浩斯：导入数据统一迁移为复习卡
            if(progress.words){
              for(const w in progress.words){ migrateToEB(progress.words[w]); }
            }
            // 合并而不是覆盖自定义词库：直接覆盖会丢掉当前用户已导入、
            // 但导出文件里没有的自定义词
            if(importedCustomVocab.length>0){
              const existKeys=new Set((customVocab||[]).map(c=>c && c.word ? c.word.toLowerCase() : ''));
              for(const c of importedCustomVocab){
                if(c && c.word && !existKeys.has(c.word.toLowerCase())){
                  customVocab.push(c);
                  existKeys.add(c.word.toLowerCase());
                }
              }
              saveCustomVocab();
              mergeCustomVocabToSystem();  // Also merge into system vocabulary
            }
            saveProgress(); renderHome(); showView('home');
            showToast('进度已导入'+(importedCustomVocab.length>0?('（含'+importedCustomVocab.length+'个自定义词汇）'):''));
          }
        });
      }catch(err){ showToast('文件解析失败'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ===== Study Session =====

function startStudy(){
  const perSession = progress.studyGoal;
  const newWords = getNewWords(perSession);
  if(newWords.length === 0){ showToast('所有单词已学习完毕！'); return; }

  // 新学单词：每个单词两遍英译汉，一遍汉翻英
  // 第1遍：英译汉 (en2cn)
  const pass1 = shuffle(newWords).map(w => ({
    ...w,
    passType: 'en2cn',
    passLabel: '英译汉',
    passNum: 1
  }));
  // 第2遍：英译汉 (en2cn)
  const pass2 = shuffle(newWords).map(w => ({
    ...w,
    passType: 'en2cn',
    passLabel: '英译汉',
    passNum: 2
  }));
  // 第3遍：汉翻英 (cn2en)
  const pass3 = shuffle(newWords).map(w => ({
    ...w,
    passType: 'cn2en',
    passLabel: '汉翻英',
    passNum: 3
  }));

  let cards = [...pass1, ...pass2, ...pass3];
  // 避免交界处相同单词连续出现
  for(let i = 1; i < cards.length; i++){
    if(cards[i].word === cards[i-1].word){
      for(let j = i + 1; j < cards.length; j++){
        if(cards[j].word !== cards[i-1].word){
          [cards[i], cards[j]] = [cards[j], cards[i]];
          break;
        }
      }
    }
  }

  session = {
    type: 'study',
    cards,
    currentIndex: 0,
    correctCount: 0,
    wrongCount: 0,
    studiedWords: new Set(newWords.map(w => w.word)),
    answeredWords: new Set(),
    retestQueue: [],
    retestInserted: new Set(),
    wordCorrectCount: {},
    startTime: Date.now()
  };
  showView('study');
  startStudyTimer();
  renderCard();
}

// 学习视图 DOM 元素缓存：renderCard 每题都会访问这些节点，
// 避免反复 getElementById 造成的开销
let _studyEls=null;
function cacheStudyEls(){
  _studyEls={
    prog:document.getElementById('study-progress-text'),
    passBadge:document.getElementById('study-pass-badge'),
    fill:document.getElementById('study-bar-fill'),
    qText:document.getElementById('study-question-text'),

    meaningText:document.getElementById('kw-meaning-text'),
    moreLabel:document.getElementById('kw-more-label'),
    opts:[0,1,2,3].map(i=>({
      btn:document.getElementById('opt-btn-'+i),
      text:document.getElementById('opt-text-'+i),
      trans:document.getElementById('trans-'+i),
      ico:document.getElementById('opt-ico-'+i)
    })),
    resArea:document.getElementById('study-result-area'),
    qCard:document.getElementById('study-question-card'),
    optionsWrap:document.getElementById('options')
  };
}

function renderCard(){
  if(!session || session.currentIndex>=session.cards.length){ completeSession(); return; }
  saveSession();
  answered=false;
  revealed=false;
  session.ratingApplied=false;
  currentCard=session.cards[session.currentIndex];
  const genResult=generateOptions(currentCard);
  currentOptions=genResult.options;
  currentOptionWords=genResult.optionWords;
  const card=currentCard;
  const isCn2En=card.passType==='cn2en';
  const questionText=isCn2En?card.meaning:card.word;
  // 恢复后的会话只保留剩余卡片，用保存时的总数/位置还原进度显示
  const total=session.totalCardCount || session.cards.length;
  const idx=(session.savedIndex || 0)+session.currentIndex+1;
  const hfCount=getWordHfCount(card.word);

  ensureStudyViewMounted();
  const e=_studyEls;

  if(e.prog) e.prog.innerHTML = idx+'<span>/'+total+'</span>';
  if(e.passBadge) e.passBadge.style.display = card.isRetest ? 'block' : 'none';
  if(e.fill) e.fill.style.width = (idx/total*100)+'%';
  if(e.qText) e.qText.textContent = questionText;
  if(e.hf){
    if(hfCount>=3){ e.hf.textContent = `高频词 · 出现${hfCount}次 · 重点记忆`; e.hf.style.display='block'; }
    else { e.hf.style.display='none'; }
  }
  if(e.speakBtn){
    if(!isCn2En){
      e.speakBtn.style.display = 'block';
      e.speakBtn.onclick = function(){ speakWord(card.word, this); };
    } else {
      e.speakBtn.style.display = 'none';
      e.speakBtn.onclick = null;
    }
  }
  // 释义区内容 = 词性+释义，默认隐藏并收起（选对后才展开）
  if(e.meaningText) e.meaningText.textContent = (card.type?card.type+' ':'')+card.meaning;
  if(e.meaningBox){ e.meaningBox.classList.remove('show','open'); }
  if(e.moreLabel) e.moreLabel.textContent = '全部释义';
  if(e.revealBtn){
    e.revealBtn.className = 'kw-reveal';
    e.revealBtn.textContent = isCn2En ? '查看选项释义' : '查看选项英文';
  }

  const letters=['A','B','C','D'];
  for(let i=0; i<4; i++){
    const opt=e.opts[i];
    if(opt.btn) opt.btn.className = 'kw-opt';
    if(opt.text) opt.text.textContent = (letters[i]+'. ') + (currentOptions[i] || '');
    if(opt.ico) opt.ico.textContent = '';
    if(opt.trans) opt.trans.textContent = getOptionTranslation(i) || '';
  }

  if(e.resArea) e.resArea.innerHTML = '';

  // 卡片入场动画：先移除 class → 强制 reflow → 重新加上，
  // 这样每题都能重新触发动画，缓解"僵硬"感
  if(e.qCard) e.qCard.classList.remove('card-enter');
  if(e.optionsWrap) e.optionsWrap.classList.remove('card-enter');
  void (e.qCard && e.qCard.offsetWidth);
  if(e.qCard) e.qCard.classList.add('card-enter');
  if(e.optionsWrap) e.optionsWrap.classList.add('card-enter');
}

// V5: Get translation for an option
function getOptionTranslation(index){
  if(!currentOptionWords || !currentOptionWords[index]) return '';
  const w = currentOptionWords[index];
  const isCn2En = currentCard.passType==='cn2en';
  // If options are English (cn2en), show Chinese meaning
  // If options are Chinese (en2cn), show English word
  return isCn2En ? w.meaning : w.word;
}

// V5: Toggle reveal translations
function toggleReveal(){
  revealed = !revealed;
  const e=_studyEls;
  const isCn2En = currentCard && currentCard.passType==='cn2en';
  if(e && e.revealBtn){
    if(revealed){
      e.revealBtn.classList.add('revealed');

      e.revealBtn.classList.remove('revealed');
      e.revealBtn.textContent = isCn2En ? '查看选项释义' : '查看选项英文';
    }
  }

      if(optBtn){
