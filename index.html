:root{
  --primary:#3B82F6;--on-primary:#FFFFFF;
  --primary-container:#DBEAFE;--on-primary-container:#1E40AF;
  --primary-light:#EFF6FF;
  --surface:#FFFFFF;--surface-variant:#F8FAFC;
  --on-surface:#0F172A;--on-surface-variant:#64748B;
  --outline:#E2E8F0;--outline-variant:#F1F5F9;
  --error:#EF4444;--error-container:#FEE2E2;--on-error:#991B1B;
  --success:#10B981;--success-container:#D1FAE5;--on-success:#065F46;
  --warning:#F59E0B;--warning-container:#FEF3C7;--on-warning:#92400E;
  --background:#F0F4F8;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.06);
  --shadow-lg:0 8px 24px rgba(0,0,0,.08);
  --radius-sm:10px;
  --radius-md:14px;
  --radius-lg:18px;
  --radius-xl:22px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--background);color:var(--on-surface);
  min-height:100vh;-webkit-font-smoothing:antialiased;
}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--background);position:relative}
.view{display:none;min-height:100vh;animation:fadeIn .3s ease}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ===== Home ===== */
.home-header{padding:32px 20px 8px;text-align:center}
.home-title{font-size:22px;font-weight:700;letter-spacing:.3px;color:var(--on-surface)}
.home-subtitle{font-size:13px;color:var(--on-surface-variant);margin-top:4px}

/* Daily Goal Card */
.daily-goal-card{
  margin:16px 20px;padding:24px 20px;border-radius:var(--radius-xl);
  background:var(--surface);box-shadow:var(--shadow-sm);
  border:1px solid var(--outline-variant);
}
.daily-goal-title{font-size:16px;font-weight:700;color:var(--on-surface);margin-bottom:2px}
.daily-goal-subtitle{font-size:12px;color:var(--on-surface-variant);margin-bottom:16px}
.daily-goal-btns{display:flex;gap:10px}
.daily-goal-btn{
  flex:1;padding:12px 0;border-radius:var(--radius-md);
  border:2px solid var(--outline);background:var(--surface);
  font-size:16px;font-weight:700;color:var(--on-surface-variant);
  cursor:pointer;transition:all .2s ease;
}
.daily-goal-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.daily-goal-btn.active{
  border-color:var(--primary);background:var(--primary-light);
  color:var(--on-primary-container);
}
.daily-goal-progress{
  margin-top:12px;height:6px;border-radius:3px;
  background:var(--surface-variant);overflow:hidden;
}
.daily-goal-progress-fill{
  height:100%;background:var(--primary);
  border-radius:3px;transition:width .5s ease;
}

/* Mode Tabs */
.mode-tabs{
  margin:16px 20px;display:flex;gap:10px;
}
.mode-tab{
  flex:1;padding:16px 12px;border-radius:var(--radius-lg);
  background:var(--surface);border:2px solid transparent;
  cursor:pointer;transition:all .2s ease;
  box-shadow:var(--shadow-sm);text-align:center;
}
.mode-tab:hover{border-color:var(--outline);transform:translateY(-1px)}
.mode-tab.active{
  background:var(--primary-light);border-color:var(--primary);
  box-shadow:0 2px 8px rgba(59,130,246,.15);
}
.mode-tab-icon{font-size:24px;margin-bottom:6px}
.mode-tab-title{font-size:15px;font-weight:700;color:var(--on-surface)}
.mode-tab-desc{font-size:11px;color:var(--on-surface-variant);line-height:1.3}
.mode-tab.active .mode-tab-title{color:var(--on-primary-container)}
.mode-tab.active .mode-tab-desc{color:var(--primary)}

/* Stats Row */
.stats-row{
  margin:16px 20px;padding:18px 12px;border-radius:var(--radius-lg);
  background:var(--surface);box-shadow:var(--shadow-sm);
  display:flex;justify-content:space-around;
  border:1px solid var(--outline-variant);
}
.stat-item{text-align:center;flex:1}
.stat-num{font-size:24px;font-weight:800;color:var(--primary);line-height:1.2}
.stat-num.warn{color:var(--warning)}
.stat-num.error{color:var(--error)}
.stat-num.success{color:var(--success)}
.stat-num.muted{color:var(--on-surface-variant)}
.stat-label{font-size:11px;color:var(--on-surface-variant);margin-top:4px;font-weight:500}

/* Action Buttons */
.home-actions{margin:16px 20px;display:flex;flex-direction:column;gap:10px}
.action-btn{
  width:100%;padding:16px;border-radius:var(--radius-lg);
  border:none;font-size:16px;font-weight:700;cursor:pointer;
  transition:all .2s ease;display:flex;align-items:center;justify-content:center;gap:8px;
}
.action-btn.primary{
  background:var(--primary);color:#fff;
  box-shadow:0 4px 12px rgba(59,130,246,.25);
}
.action-btn.primary:hover{background:#2563EB;box-shadow:0 6px 16px rgba(59,130,246,.35)}
.action-btn.primary:active{transform:scale(.98)}
.action-btn.primary:disabled{background:var(--outline);color:var(--on-surface-variant);box-shadow:none;cursor:not-allowed}
.action-btn.secondary{
  background:var(--surface);color:var(--on-surface);
  border:2px solid var(--outline);
}
.action-btn.secondary:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.action-btn.secondary:active{transform:scale(.98)}
.action-btn.secondary:disabled{border-color:var(--outline);color:var(--outline);cursor:not-allowed;background:var(--surface)}
.action-btn.tertiary{
  background:var(--surface);color:var(--success);
  border:2px solid var(--success-container);
}
.action-btn.tertiary:hover{background:var(--success-container);border-color:var(--success)}
.action-btn.tertiary:active{transform:scale(.98)}
.action-btn.tertiary:disabled{border-color:var(--outline);color:var(--outline);cursor:not-allowed;background:var(--surface)}

/* Resume Banner */
.resume-banner{
  margin:0 20px 16px;padding:16px 18px;border-radius:var(--radius-lg);
  background:linear-gradient(135deg,#FEF3C7,#FDE68A);
  border:1px solid #FCD34D;
}
.resume-banner-title{font-size:13px;color:#92400E;font-weight:700;margin-bottom:4px}
.resume-banner-desc{font-size:12px;color:#78350F;margin-bottom:12px}
.resume-banner-actions{display:flex;gap:10px}
.resume-btn-primary{flex:1;padding:10px;border-radius:var(--radius-sm);border:none;background:#F59E0B;color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.resume-btn-secondary{padding:10px 16px;border-radius:var(--radius-sm);border:1px solid #FBBF24;background:#fff;color:#92400E;font-size:13px;font-weight:600;cursor:pointer}

/* Progress Card */
.progress-card{
  margin:16px 20px;padding:20px;border-radius:var(--radius-lg);
  background:var(--surface);box-shadow:var(--shadow-sm);
  border:1px solid var(--outline-variant);
}
.progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.progress-title{font-size:14px;font-weight:700;color:var(--on-surface)}
.progress-value{font-size:13px;font-weight:600;color:var(--on-surface-variant)}
.progress-bar{height:6px;background:var(--outline-variant);border-radius:3px;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),#60A5FA);border-radius:3px;transition:width .5s ease}
.progress-detail{display:flex;gap:16px;margin-top:14px;font-size:12px;color:var(--on-surface-variant);flex-wrap:wrap}
.progress-detail span b{color:var(--on-surface);font-weight:700}

/* Section */
.home-section{margin:20px 20px 8px}
.home-section-title{font-size:14px;font-weight:700;color:var(--on-surface);margin-bottom:10px}

/* Data Buttons */
.data-row{display:flex;gap:10px;margin:0 20px 12px;flex-wrap:wrap}
.data-btn{flex:1;min-width:130px;padding:12px;border-radius:var(--radius-md);
  border:1px solid var(--outline);background:var(--surface);
  color:var(--on-surface-variant);font-size:13px;font-weight:600;
  cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:6px}
.data-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.data-btn.import-btn{border-color:var(--success-container);color:var(--success)}
.data-btn.import-btn:hover{background:var(--success-container)}

/* Timer Card */
.timer-card{margin:16px 20px;display:flex;gap:10px}
.timer-item{flex:1;padding:16px;border-radius:var(--radius-lg);background:var(--surface);text-align:center;box-shadow:var(--shadow-sm);border:1px solid var(--outline-variant)}
.timer-item.today{background:linear-gradient(135deg,var(--primary-light),var(--surface))}
.timer-num{font-size:26px;font-weight:800;color:var(--primary);line-height:1.2}
.timer-unit{font-size:13px;font-weight:500;color:var(--on-surface-variant)}
.timer-label{font-size:11px;color:var(--on-surface-variant);margin-top:4px}

.reset-btn{display:block;margin:16px auto 8px;padding:8px 16px;border:none;background:transparent;
  color:var(--error);font-size:13px;cursor:pointer;opacity:.6}
.reset-btn:hover{opacity:1}
.logout-btn{display:block;margin:8px auto 32px;padding:8px 16px;border:none;background:transparent;
  color:var(--on-surface-variant);font-size:13px;cursor:pointer;opacity:.6}
.logout-btn:hover{opacity:1;color:var(--error)}

.user-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;
  background:var(--primary-container);color:var(--on-primary-container);font-size:13px;font-weight:600}

/* ===== Study ===== */
.study-topbar{display:flex;align-items:center;padding:14px 18px;gap:12px;position:sticky;top:0;background:var(--background);z-index:10}
.back-btn{width:40px;height:40px;border-radius:50%;border:none;background:var(--surface);
  color:var(--on-surface);font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:var(--shadow-sm);border:1px solid var(--outline-variant);transition:all .15s ease;
  user-select:none;-webkit-tap-highlight-color:transparent;
}
.back-btn:hover{background:var(--primary-container);color:var(--primary)}
.back-btn:active{transform:scale(0.92)}
.study-progress{flex:1;font-size:14px;font-weight:700;color:var(--on-surface)}
.study-progress span{color:var(--on-surface-variant);font-weight:500}
.pass-badge{padding:5px 14px;border-radius:20px;background:var(--primary-container);color:var(--on-primary-container);font-size:12px;font-weight:600;flex-shrink:0}

.study-bar{height:3px;background:var(--outline-variant);margin:0 18px;border-radius:2px;overflow:hidden}
.study-bar-fill{height:100%;background:var(--primary);border-radius:2px;transition:width .3s ease}

.card-container{padding:20px 18px}

/* Word Card - New Design */
.word-card{
  background:var(--surface);border-radius:var(--radius-xl);
  padding:32px 24px;text-align:center;margin-bottom:20px;
  box-shadow:var(--shadow-md);border:1px solid var(--outline-variant);
  position:relative;
}
.word-status-badge{
  display:inline-block;padding:5px 14px;border-radius:20px;
  background:var(--primary-light);color:var(--primary);
  font-size:12px;font-weight:700;margin-bottom:16px;
  letter-spacing:.5px;
}
.word-status-badge.new{background:#FEF3C7;color:#D97706}
.word-status-badge.learning{background:#DBEAFE;color:#2563EB}
.word-status-badge.review{background:#D1FAE5;color:#059669}
.word-status-badge.relearning{background:#FEE2E2;color:#DC2626}
.word-main{font-size:38px;font-weight:800;color:var(--on-surface);letter-spacing:.5px;word-break:break-word;line-height:1.2}
.word-meaning{font-size:17px;color:var(--on-surface);margin-top:12px;line-height:1.5;font-weight:500}
.word-type{font-size:13px;color:var(--on-surface-variant);margin-top:6px}
.word-fsrs-info{
  display:flex;justify-content:center;gap:16px;margin-top:16px;
  font-size:11px;color:var(--on-surface-variant);flex-wrap:wrap;
}
.word-fsrs-info span b{color:var(--on-surface);font-weight:600}
.word-speak-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px}

.question-card{
  background:var(--surface);border-radius:var(--radius-xl);padding:32px 24px;
  text-align:center;margin-bottom:20px;min-height:160px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  box-shadow:var(--shadow-md);border:1px solid var(--outline-variant);
}
.question-hint{font-size:13px;color:var(--on-surface-variant);margin-bottom:12px}
.question-text{font-size:28px;font-weight:700;color:var(--on-surface);line-height:1.4;word-break:break-word}
.question-type{font-size:14px;color:var(--on-surface-variant);margin-top:8px}

.options{display:flex;flex-direction:column;gap:10px}
.option-btn{
  display:flex;align-items:center;gap:12px;padding:14px 18px;
  border-radius:var(--radius-md);border:2px solid var(--outline);background:var(--surface);
  font-size:15px;cursor:pointer;transition:all .2s;text-align:left;
  color:var(--on-surface);line-height:1.4;
  box-shadow:var(--shadow-sm);
}
.option-btn:hover:not(.disabled){border-color:var(--primary);background:var(--primary-light)}
.option-btn.disabled{cursor:default}
.option-btn.correct{border-color:var(--success);background:var(--success-container);color:var(--on-success)}
.option-btn.wrong{border-color:var(--error);background:var(--error-container);color:var(--on-error)}
.option-label{width:28px;height:28px;border-radius:50%;background:var(--surface-variant);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.option-btn.correct .option-label{background:var(--success);color:#fff}
.option-btn.wrong .option-label{background:var(--error);color:#fff}
.option-translation{font-size:12px;color:var(--on-surface-variant);margin-top:4px;display:none}
.option-btn.revealed .option-translation{display:block}

.reveal-btn{
  display:block;width:100%;margin-bottom:14px;padding:11px;
  border-radius:var(--radius-md);border:1px dashed var(--primary);background:var(--primary-light);
  color:var(--primary);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;
}
.reveal-btn:hover{background:var(--primary-container)}
.reveal-btn.revealed{border-style:solid;background:var(--surface);color:var(--on-surface-variant);border-color:var(--outline)}

.ignore-row{margin-top:12px;text-align:center}
.ignore-btn{
  padding:8px 20px;border-radius:20px;border:1px solid #E53E3E;
  background:transparent;color:#E53E3E;font-size:13px;font-weight:500;
  cursor:pointer;transition:all .2s;
}
.ignore-btn:hover{background:#FFF5F5}

.result-card{margin-top:20px;padding:20px;border-radius:16px;background:var(--surface-variant);
  animation:fadeIn .3s ease;position:relative}
.result-word{font-size:22px;font-weight:700;color:var(--primary)}
.result-type{font-size:14px;color:var(--on-surface-variant);margin-top:4px}
.result-meaning{font-size:16px;color:var(--on-surface);margin-top:8px;line-height:1.5}
.result-category{display:inline-block;margin-top:8px;padding:2px 10px;border-radius:12px;
  background:var(--primary-container);color:var(--on-primary-container);font-size:12px;font-weight:500}

.speak-btn{width:44px;height:44px;border-radius:50%;border:none;background:var(--primary);
  color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .2s;box-shadow:0 2px 8px rgba(0,120,212,.25)}
.speak-btn:hover{background:#106EBE;transform:scale(1.05)}
.speak-btn:active{transform:scale(.95)}
.speak-btn.speaking{animation:pulse .6s ease infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.result-speak-btn{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;
  border:none;background:var(--primary);color:#fff;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .2s}
.result-speak-btn:hover{background:#106EBE;transform:scale(1.05)}
.result-speak-btn:active{transform:scale(.95)}
.question-speak-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:12px}

.btn-continue{display:block;width:100%;margin-top:20px;padding:16px;border-radius:16px;
  border:none;background:var(--primary);color:#fff;font-size:17px;font-weight:600;
  cursor:pointer;transition:all .2s;animation:fadeIn .3s ease}
.btn-continue:hover{background:#106EBE}

/* ===== Complete ===== */
.complete-container{padding:60px 24px;text-align:center;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.complete-icon{width:72px;height:72px;border-radius:50%;background:var(--success-container);
  display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:36px;color:var(--success)}
.complete-title{font-size:24px;font-weight:700;margin-bottom:8px}
.complete-subtitle{font-size:14px;color:var(--on-surface-variant);margin-bottom:32px}
.complete-stats{display:flex;gap:16px;margin-bottom:32px}
.complete-stat{flex:1;padding:20px;border-radius:16px;background:var(--surface-variant)}
.complete-stat-num{font-size:32px;font-weight:700;color:var(--primary)}
.complete-stat-num.green{color:var(--success)}
.complete-stat-num.red{color:var(--error)}

/* Vocab list page */
.vocab-header{position:sticky;top:0;z-index:10;background:var(--background);padding:12px 16px;border-bottom:1px solid var(--outline)}
.vocab-header-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.vocab-back-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--outline);background:var(--surface);cursor:pointer;font-size:14px}
.vocab-title{flex:1;font-size:18px;font-weight:700}
.vocab-count{font-size:13px;color:var(--on-surface-variant)}
.vocab-search{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--outline);
  background:var(--surface);font-size:14px;outline:none;box-sizing:border-box}
.vocab-search:focus{border-color:var(--primary)}
.vocab-filter-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.vocab-filter-btn{padding:6px 12px;border-radius:16px;border:1px solid var(--outline);
  background:var(--surface);font-size:12px;cursor:pointer;color:var(--on-surface-variant)}
.vocab-filter-btn.active{border-color:var(--primary);background:var(--primary-container);color:var(--primary)}
.vocab-export-btn{padding:8px 16px;border-radius:10px;border:1px solid var(--success);
  background:transparent;color:var(--success);font-size:13px;font-weight:500;cursor:pointer}
.vocab-list{padding:8px 0}
.vocab-item{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--surface-variant);gap:12px}
.vocab-item:hover{background:var(--surface)}
.vocab-word{font-size:16px;font-weight:600;min-width:120px}
.vocab-type{font-size:12px;color:var(--on-surface-variant);min-width:50px}
.vocab-meaning{flex:1;font-size:14px;color:var(--on-surface);line-height:1.4}
.vocab-status{font-size:11px;padding:2px 8px;border-radius:10px;white-space:nowrap}
.vocab-status.new{background:#FEF3C7;color:#92400E}
.vocab-status.learning{background:#DBEAFE;color:#1E40AF}
.vocab-status.review{background:#D1FAE5;color:#065F46}
.vocab-status.relearning{background:#FEE2E2;color:#991B1B}
.vocab-status.mastered{background:#E0E7FF;color:#3730A3}
.vocab-status.ignored{background:#E5E7EB;color:#4B5563}

<body>
<div id="app">
  <div id="view-login" class="view"></div>
  <div id="view-home" class="view"></div>
  <div id="view-study" class="view"></div>
  <div id="view-complete" class="view"></div>
  <div id="view-vocab" class="view"></div>
</div>
<div id="toast" style="display:none"></div>
<div id="import-modal" style="display:none"></div>
<div id="confirm-modal" style="display:none"></div>

<script src="./data.js"></script>
<script>
// ===== Config =====
const REVIEW_INTERVALS = [1, 2, 4, 7, 15, 30]; // Legacy, kept for migration

// ===== Official ts-fsrs FSRS-6 Adapter =====
// The scheduling engine is the official ts-fsrs package (FSRS-6).
// This adapter bridges the official Card/ReviewLog objects with the APP's word structure.
const FSRS_CONFIG = {
  request_retention: 0.90,
  maximum_interval: 36500,
  enable_fuzz: true,
  enable_short_term: true,
  learning_steps: ['1m', '10m'],
  relearning_steps: ['10m']
};
const MASTERED_STABILITY_THRESHOLD = 30; // 稳定性 >= 30天 且 state===Review 视为已掌握

let fsrsScheduler = null;
let fsrsReady = false;

function getFSRSScheduler(){
  if(fsrsScheduler) return fsrsScheduler;
  const api = fsrsApi();
  if(api && typeof api.fsrs === 'function'){
    try{
      fsrsScheduler = api.fsrs(FSRS_CONFIG);
      fsrsReady = true;
      return fsrsScheduler;
    }catch(e){
      console.error('Failed to create FSRS scheduler:', e);
    }
  }
  return null;
}

async function ensureFSRS(){
  if(fsrsScheduler) return fsrsScheduler;
  const api = window.__TSFSRS || await window.__TSFSRSReady;
  if(api && typeof api.fsrs === 'function'){
    fsrsScheduler = api.fsrs(FSRS_CONFIG);
    fsrsReady = true;
    return fsrsScheduler;
  }
  return getFSRSScheduler();
}

function fsrsApi(){
  if(window.__TSFSRS) return window.__TSFSRS;
  if(typeof TSFSRS !== 'undefined') {
    window.__TSFSRS = TSFSRS;
    return window.__TSFSRS;
  }
  return {
    State: { New: 0, Learning: 1, Review: 2, Relearning: 3 },
    Rating: { Again: 1, Hard: 2, Good: 3, Easy: 4 },
    createEmptyCard: () => ({ due: new Date(), stability: 0, difficulty: 0, elapsed_days: 0, scheduled_days: 0, reps: 0, lapses: 0, state: 0, last_review: null })
  };
}

// State enum helpers
function fsrsStateName(state){
  const api=fsrsApi();
  if(state===api.State.New) return 'New';
  if(state===api.State.Learning) return 'Learning';
  if(state===api.State.Review) return 'Review';
  if(state===api.State.Relearning) return 'Relearning';
  return String(state);
}

function fsrsStateNameCn(state){
  const api=fsrsApi();
  if(state===api.State.New) return '新词';
  if(state===api.State.Learning) return '学习中';
  if(state===api.State.Review) return '复习中';
  if(state===api.State.Relearning) return '重学中';
  return String(state);
}

// Rating enum helpers
function fsrsRatingName(rating){
  const api=fsrsApi();
  if(rating===api.Rating.Again) return 'Again';
  if(rating===api.Rating.Hard) return 'Hard';
  if(rating===api.Rating.Good) return 'Good';
  if(rating===api.Rating.Easy) return 'Easy';
  return String(rating);
}

function fsrsRatingFromStudyResult(correctCount){
  const api=fsrsApi();
  if(correctCount>=3) return api.Rating.Easy;
  if(correctCount===2) return api.Rating.Good;
  if(correctCount===1) return api.Rating.Hard;
  return api.Rating.Again;
}

// Serialize an official Card into a JSON-safe object stored under word.fsrs.
function serializeFSRSCard(card){
  return {
    due: card.due instanceof Date ? card.due.getTime() : Number(card.due),
    stability: card.stability ?? 0,
    difficulty: card.difficulty ?? 0,
    elapsed_days: card.elapsed_days ?? 0,
    scheduled_days: card.scheduled_days ?? 0,
    reps: card.reps ?? 0,
    lapses: card.lapses ?? 0,
    state: card.state,
    step: card.step ?? null,
    last_review: card.last_review instanceof Date ? card.last_review.getTime() : (card.last_review ?? null)
  };
}

// Hydrate a saved card object back into a usable FSRS Card
function hydrateFSRSCard(saved){
  const api=fsrsApi();
  const card=api.createEmptyCard();
  if(!saved) return card;
  return {
    ...card,
    due: new Date(saved.due || Date.now()),
    stability: Number(saved.stability || 0),
    difficulty: Number(saved.difficulty || 0),
    elapsed_days: Number(saved.elapsed_days || 0),
    scheduled_days: Number(saved.scheduled_days || 0),
    reps: Number(saved.reps || 0),
    lapses: Number(saved.lapses || 0),
    state: saved.state ?? api.State.New,
    step: saved.step ?? null,
    last_review: saved.last_review ? new Date(saved.last_review) : undefined
  };
}

// Get FSRS Card from word state (handles both new format with .fsrs and legacy format)
function getFSRSCard(wordState){
  if(wordState && wordState.fsrs) return hydrateFSRSCard(wordState.fsrs);
  // Legacy records: reconstruct FSRS card from old D/S/lastReview/nextReview fields
  const api=fsrsApi();
  const card=api.createEmptyCard();
  if(wordState && (wordState.stability!==undefined || wordState.difficulty!==undefined)){
    card.due=new Date(wordState.nextReview || Date.now());
    card.stability=Number(wordState.stability || 1);
    card.difficulty=Number(wordState.difficulty || 5);
    card.state=api.State.Review;
    card.reps=Math.max(1,(wordState.correct||0)+(wordState.wrong||0));
    card.lapses=Number(wordState.wrong||0);
    card.last_review=wordState.lastReview ? new Date(wordState.lastReview) : undefined;
    card.elapsed_days=card.last_review ? Math.max(0,(Date.now()-card.last_review.getTime())/86400000) : 0;
    card.scheduled_days=Math.max(0,Math.round(card.stability));
  }
  return card;
}

// Sync FSRS card data back to word state (keeps legacy fields for UI compatibility)
function syncLegacyFieldsFromCard(wordState, card, rating){
  const api=fsrsApi();
  wordState.fsrs=serializeFSRSCard(card);
  wordState.stability=card.stability;
  wordState.difficulty=card.difficulty;
  wordState.lastReview=card.last_review ? new Date(card.last_review).getTime() : Date.now();
  wordState.nextReview=card.due instanceof Date ? card.due.getTime() : Number(card.due);
  wordState.fsrsState=fsrsStateName(card.state);

  // Legacy level display compatibility
  if(rating===api.Rating.Again) wordState.level=Math.max(0,(wordState.level||0)-1);
  else if(rating===api.Rating.Hard) wordState.level=Math.min(6,(wordState.level||0));
  else if(rating===api.Rating.Good) wordState.level=Math.min(6,(wordState.level||0)+1);
  else if(rating===api.Rating.Easy) wordState.level=Math.min(6,(wordState.level||0)+2);

  // "已掌握" = stability >= 30天 AND state === Review
  // ignored status is preserved
  const total=(wordState.correct||0)+(wordState.wrong||0);
  const accuracy=total ? (wordState.correct||0)/total : 0;
  if(card.state===api.State.Review && card.stability>=MASTERED_STABILITY_THRESHOLD && total>=5 && accuracy>=0.8){
    wordState.status='mastered';
  }else if(wordState.status!=='ignored'){
    wordState.status='review';
  }
}

// Check if a word is in "mastered" state using FSRS criteria
function isWordMastered(wp){
  if(!wp || wp.status==='ignored') return false;
  if(wp.status==='mastered') return true; // cached status
  // Check FSRS criteria directly
  if(wp.fsrs){
    const api=fsrsApi();
    return wp.fsrs.state===api.State.Review && wp.fsrs.stability>=MASTERED_STABILITY_THRESHOLD;
  }
  return false;
}

// Migrate old word data to FSRS-6 format
function migrateToFSRS6(word){
  if(word.status==='ignored') return; // ignored words don't need FSRS card
  if(word.fsrs){
    // Already migrated, just normalize timestamps
    const c=hydrateFSRSCard(word.fsrs);
    word.fsrs=serializeFSRSCard(c);
    word.stability=c.stability;
    word.difficulty=c.difficulty;
    word.nextReview=c.due.getTime();
    word.fsrsState=fsrsStateName(c.state);
    return;
  }
  // Legacy migration: build FSRS card from old fields
  const card=getFSRSCard(word);
  word.fsrs=serializeFSRSCard(card);
  word.stability=card.stability;
  word.difficulty=card.difficulty;
  word.nextReview=card.due.getTime();
  word.lastReview=card.last_review ? card.last_review.getTime() : (word.lastReview||null);
  word.fsrsState=fsrsStateName(card.state);
  if(!word.status || word.status==='new') word.status='review';
}

// Get retrievability (current recall probability)
function fsrsRetrievability(wordState, now=Date.now()){
  if(!wordState) return 0;
  try{
    const scheduler = getFSRSScheduler();
    if(!scheduler) return 0;
    const card=getFSRSCard(wordState);
    return scheduler.get_retrievability(card,new Date(now),false);
  }catch(e){ return 0; }
}

// Get next interval in days
function fsrsNextInterval(wordState){
  try{
    const scheduler = getFSRSScheduler();
    if(!scheduler) return 0;
    const card=typeof wordState==='object' ? getFSRSCard(wordState) : null;
    if(!card) return 0;
    return scheduler.next_interval(card.stability,0);
  }catch(e){ return 0; }
}

// Apply one official FSRS rating. Returns the scheduler result.
function applyFSRSRating(wordState,rating,now=Date.now()){
  const scheduler = getFSRSScheduler();
  const card=getFSRSCard(wordState);
  const before=serializeFSRSCard(card);
  if(scheduler && typeof scheduler.next==='function'){
    const result=scheduler.next(card,new Date(now),rating);
    const after=result.card;
    syncLegacyFieldsFromCard(wordState,after,rating);
    return {result,before,after:serializeFSRSCard(after)};
  }
  // Fallback if scheduler is completely unavailable
  return {result:{card},before,after:before};
}

// Preview all four possible ratings
function previewFSRS(wordState,now=Date.now()){
  const scheduler = getFSRSScheduler();
  const card=getFSRSCard(wordState);
  if(scheduler && typeof scheduler.repeat==='function'){
    return scheduler.repeat(card,new Date(now));
  }
  return null;
}

// Check if a card is due for review
function isCardDue(wordState, now=Date.now()){
  if(!wordState || wordState.status==='ignored') return false;
  if(wordState.status==='new' || !wordState.fsrs) return false;
  return wordState.nextReview <= now;
}

// ===== State =====
let progress = null;
let session = null;
let answered = false;
let revealed = false;
let currentOptions = [];
let currentCard = null;
let customVocab = [];
let studyTimerInterval = null;

// ===== Utils =====
// Beijing time (UTC+8) with 5 AM as daily boundary
// Before 5 AM = still "yesterday" in study terms
function dateToStudyDay(ts){
  const d=new Date(ts);
  const beijing=new Date(d.getTime()+8*3600000);
  if(beijing.getUTCHours()<5) beijing.setUTCDate(beijing.getUTCDate()-1);
  return beijing.toISOString().split('T')[0];
}
function getToday(){ return dateToStudyDay(Date.now()); }
function getYesterday(){
  const now=new Date();
  const beijing=new Date(now.getTime()+8*3600000);
  if(beijing.getUTCHours()<5) beijing.setUTCDate(beijing.getUTCDate()-2);
  else beijing.setUTCDate(beijing.getUTCDate()-1);
  return beijing.toISOString().split('T')[0];
}
// Calendar date in Beijing time (midnight cutoff, for study time tracking)
function getCalendarDate(){
  const d=new Date();
  const beijing=new Date(d.getTime()+8*3600000);
  return beijing.toISOString().split('T')[0];
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function escapeHtml(text){
  if(!text) return '';
  return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function showAppConfirm(opts){
  const options = Object.assign({
    title: '确认提示',
    message: '',
    icon: '⚠️',
    confirmText: '确定',
    cancelText: '取消',
    isDanger: false,
    onConfirm: null
  }, opts || {});

  let modal = document.getElementById('confirm-modal');
  if(!modal){
    modal = document.createElement('div');
    modal.id = 'confirm-modal';
    document.body.appendChild(modal);
  }
  modal.className = 'confirm-modal';
  modal.innerHTML = `
    <div class="confirm-box">
      <div class="confirm-icon">${options.icon}</div>
      <div class="confirm-title">${escapeHtml(options.title)}</div>
      <div class="confirm-desc">${escapeHtml(options.message)}</div>
      <div class="confirm-actions">
        <button class="confirm-btn cancel" id="confirm-btn-cancel">${escapeHtml(options.cancelText)}</button>
        <button class="confirm-btn ok ${options.isDanger ? 'danger' : ''}" id="confirm-btn-ok">${escapeHtml(options.confirmText)}</button>
      </div>
    </div>
  `;
  modal.style.display = 'flex';

  const close = () => {
    modal.style.display = 'none';
    modal.innerHTML = '';
  };

  const cancelBtn = modal.querySelector('#confirm-btn-cancel');
  if(cancelBtn) cancelBtn.onclick = close;
  modal.onclick = (e) => {
    if(e.target === modal) close();
  };
  const okBtn = modal.querySelector('#confirm-btn-ok');
  if(okBtn){
    okBtn.onclick = () => {
      close();
      if(typeof options.onConfirm === 'function') options.onConfirm();
    };
  }
}

function getAllVocab(){
  const seen=new Set();
  const merged=[];
  const source = Array.isArray(VOCAB_DATA) ? VOCAB_DATA : [];
  for(const w of source){
    if(!w || !w.word) continue;
    const key=w.word.toLowerCase();
    if(!seen.has(key)){
      seen.add(key);
      merged.push(w);
    }
  }
  const custom = Array.isArray(customVocab) ? customVocab : [];
  for(const w of custom){
    if(!w || !w.word) continue;
    const key=w.word.toLowerCase();
    if(!seen.has(key)){
      seen.add(key);
      merged.push(w);
    }
  }
  return merged;
}

function getWordHfCount(word){
  const key=word.toLowerCase();
  const cv=customVocab.find(c=>c.word.toLowerCase()===key);
  if(cv && cv.hfCount) return cv.hfCount;
  if(progress && progress.hfOverrides && progress.hfOverrides[key]) return progress.hfOverrides[key];
  return 0;
}

// ===== Text-to-Speech =====
let ttsVoice = null;
let ttsUnlocked = false;
let ttsAvailable = ('speechSynthesis' in window) && (typeof SpeechSynthesisUtterance !== 'undefined');

function loadTTSVoice(){
  if(!ttsAvailable) return;
  const voices = speechSynthesis.getVoices();
  if(voices.length===0) return;
  const usVoices = voices.filter(v=>v.lang==='en-US');
  if(usVoices.length>0){
    const preferred = usVoices.find(v=>/google|natural|samantha|aria|daniel|zira/i.test(v.name));
    ttsVoice = preferred || usVoices[0];
  } else if(voices.length>0){
    ttsVoice = voices.find(v=>v.lang.startsWith('en')) || voices[0];
  }
}

function unlockTTS(){
  if(ttsUnlocked || !ttsAvailable) return;
  ttsUnlocked = true;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance('');
    u.volume = 0; u.rate = 1; u.lang = 'en-US';
    speechSynthesis.speak(u);
  }catch(e){}
}

['touchstart','click','keydown'].forEach(evt=>{
  document.addEventListener(evt, unlockTTS, {once:true, passive:true});
});

function speakWord(word, btnEl){
  if(ttsAvailable){
    try{ speechSynthesis.resume(); }catch(e){}
    speechSynthesis.cancel();
    setTimeout(()=>{
      const utter = new SpeechSynthesisUtterance(word);
      utter.lang = 'en-US'; utter.rate = 0.9; utter.pitch = 1; utter.volume = 1;
      if(ttsVoice) utter.voice = ttsVoice;
      if(btnEl){
        btnEl.classList.add('speaking');
        utter.onend = ()=>{ btnEl.classList.remove('speaking'); };
        utter.onerror = ()=>{ btnEl.classList.remove('speaking'); speakOnline(word, btnEl); };
      }
      try{
        speechSynthesis.speak(utter);
        setTimeout(()=>{ try{ speechSynthesis.resume(); }catch(e){} }, 100);
        setTimeout(()=>{
          if(btnEl && btnEl.classList.contains('speaking')){
            try{ speechSynthesis.cancel(); }catch(e){}
            btnEl.classList.remove('speaking');
            speakOnline(word, btnEl);
          }
        }, 3000);
      }catch(e){
        if(btnEl) btnEl.classList.remove('speaking');
        speakOnline(word, btnEl);
      }
    }, 50);
    return;
  }
  speakOnline(word, btnEl);
}

function speakOnline(word, btnEl){
  try{
    const url='https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(word)+'&type=2';
    const audio=new Audio(url);
    if(btnEl){
      btnEl.classList.add('speaking');
      audio.onended=()=>{ btnEl.classList.remove('speaking'); };
      audio.onerror=()=>{ btnEl.classList.remove('speaking'); };
    }
    audio.play().catch(()=>{ if(btnEl) btnEl.classList.remove('speaking'); });
  }catch(e){ if(btnEl) btnEl.classList.remove('speaking'); }
}

if(ttsAvailable){
  loadTTSVoice();
  speechSynthesis.onvoiceschanged = loadTTSVoice;
  let voiceRetryCount = 0;
  const voiceRetry = setInterval(()=>{
    voiceRetryCount++;
    if(ttsVoice || voiceRetryCount>=10){ clearInterval(voiceRetry); return; }
    loadTTSVoice();
  }, 500);
}

// ===== IndexedDB Storage =====
let dbInstance = null;

function initDB(){
  return new Promise((resolve)=>{
    if(!('indexedDB' in window)){ resolve(null); return; }
    try{
      const req = indexedDB.open('vocabDB2', 1);
      req.onupgradeneeded = (e)=>{
        const db = e.target.result;
        if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
      };
      req.onsuccess = (e)=>{ dbInstance = e.target.result; resolve(dbInstance); };
      req.onerror = ()=>{ resolve(null); };
    }catch(e){ resolve(null); }
  });
}

function dbSet(key, value){
  return new Promise((resolve)=>{
    if(!dbInstance){ resolve(false); return; }
    try{
      const tx = dbInstance.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(value, key);
      tx.oncomplete = ()=>{ resolve(true); };
      tx.onerror = ()=>{ resolve(false); };
    }catch(e){ resolve(false); }
  });
}

function dbGet(key){
  return new Promise((resolve)=>{
    if(!dbInstance){ resolve(null); return; }
    try{
      const tx = dbInstance.transaction('kv', 'readonly');
      const req = tx.objectStore('kv').get(key);
      req.onsuccess = ()=>{ resolve(req.result !== undefined ? req.result : null); };
      req.onerror = ()=>{ resolve(null); };
    }catch(e){ resolve(null); }
  });
}

function dbDelete(key){
  return new Promise((resolve)=>{
    if(!dbInstance){ resolve(false); return; }
    try{
      const tx = dbInstance.transaction('kv', 'readwrite');
      tx.objectStore('kv').delete(key);
      tx.oncomplete = ()=>{ resolve(true); };
      tx.onerror = ()=>{ resolve(false); };
    }catch(e){ resolve(false); }
  });
}

// FSRS-6 version: logs rating and before/after card states
async function logReview(word, rating, beforeCard, afterCard, sessionType){
  if(!dbInstance) return;
  try{
    const key = getStorageKey('reviewLogs');
    const existing = await dbGet(key);
    const logs = Array.isArray(existing) ? existing : [];
    const api = fsrsApi();
    logs.push({
      w: word,
      t: Date.now(),
      r: rating, // FSRS Rating: 1=Again, 2=Hard, 3=Good, 4=Easy
      c: rating===api.Rating.Again ? 0 : 1, // 0=wrong, 1=correct (for compatibility)
      sb: beforeCard ? beforeCard.stability : 0,
      db: beforeCard ? beforeCard.difficulty : 0,
      sa: afterCard ? afterCard.stability : 0,
      da: afterCard ? afterCard.difficulty : 0,
      d: beforeCard ? beforeCard.elapsed_days : 0,
      before: beforeCard,
      after: afterCard,
      st: sessionType
    });
    await dbSet(key, logs);
  }catch(e){}
}

function getVocabStatusLabel(wp){
  if(!wp) return {text:'未学', cls:'new'};
  if(wp.status==='ignored') return {text:'已斩', cls:'ignored'};
  if(wp.status==='new') return {text:'未学', cls:'new'};
  // FSRS-6 states
  if(wp.fsrsState==='Learning') return {text:'学习中', cls:'learning'};
  if(wp.fsrsState==='Review'){
    if(isWordMastered(wp)) return {text:'已掌握', cls:'mastered'};
    return {text:'复习中', cls:'review'};
  }
  if(wp.fsrsState==='Relearning') return {text:'重学中', cls:'relearning'};
  if(wp.status==='mastered') return {text:'已掌握', cls:'mastered'};
  if(wp.status==='review') return {text:'学习中', cls:'review'};
  return {text:'未知', cls:'new'};
}

function getFilteredVocab(){
  const all=getAllVocab();
  let filtered=all;
  if(vocabFilter!=='all'){
    filtered=filtered.filter(w=>{
      const wp=progress.words[w.word];
      if(vocabFilter==='new') return !wp || wp.status==='new';
      if(vocabFilter==='ignored') return wp && wp.status==='ignored';
      if(vocabFilter==='mastered') return wp && isWordMastered(wp);
      if(vocabFilter==='learning') return wp && wp.fsrsState==='Learning';
      if(vocabFilter==='relearning') return wp && wp.fsrsState==='Relearning';
      if(vocabFilter==='review') return wp && wp.fsrsState==='Review' && !isWordMastered(wp);
      return wp && wp.status===vocabFilter;
    });
  }
  if(vocabSearch.trim()){
    const q=vocabSearch.trim().toLowerCase();
    filtered=filtered.filter(w=>
      w.word.toLowerCase().includes(q) ||
      (w.meaning||'').toLowerCase().includes(q)
    );
  }
  return filtered;
}

function buildVocabExcelData(words){
  const data=[['单词','词性','释义','分类','学习状态','稳定性','难度','正确次数','错误次数']];
  for(const w of words){
    const wp=progress.words[w.word];
    const st=getVocabStatusLabel(wp);
    data.push([
      w.word,
      w.type||'',
      w.meaning||'',
      w.category||'',
      st.text,
      wp?(wp.stability?wp.stability.toFixed(1)+'天':'-'):'-',
      wp?(wp.difficulty?wp.difficulty.toFixed(1):'-'):'-',
      wp?(wp.correct||0):0,
      wp?(wp.wrong||0):0
    ]);
  }
  return data;
}

// ===== Progress =====
function loadProgress(){
  const key = getStorageKey('vocabProgress');
  if(storageAvailable){
    const saved=localStorage.getItem(key);
    if(saved){ try{ progress=JSON.parse(saved); }catch(e){ progress=null; } }
  }
  if(!progress){
    progress={
      dailyGoal:100, studyGoal:100, reviewGoal:0,
      todayDate:getToday(), todayNewCount:0, todayReviewCount:0,
      words:{},
      stats:{totalLearned:0,totalMastered:0,totalCorrect:0,totalWrong:0,streak:0,lastStudyDate:null,
             todayStudyMinutes:0,totalStudyMinutes:0,todayStudyDate:''}
    };
  }
  // V5 defaults
  if(progress.studyGoal===undefined || progress.studyGoal<100) progress.studyGoal=100; if(progress.studyGoal>400) progress.studyGoal=400;
  if(progress.reviewGoal===undefined) progress.reviewGoal=0; // 0=今日待复习量
  if(progress.reviewGoal===80) progress.reviewGoal=200;
  if(progress.todayDate!==getToday()){ progress.todayDate=getToday(); progress.todayNewCount=0; progress.todayReviewCount=0; }
  if(progress.todayReviewCount===undefined) progress.todayReviewCount=0;
  if(!progress.stats) progress.stats={};
  if(progress.stats.todayStudyMinutes===undefined) progress.stats.todayStudyMinutes=0;
  if(progress.stats.totalStudyMinutes===undefined) progress.stats.totalStudyMinutes=0;
  if(progress.stats.todayStudyDate===undefined) progress.stats.todayStudyDate='';
  // Reset daily study time at midnight (calendar date, not 5AM study day)
  if(progress.stats.todayStudyDate!==getCalendarDate()){
    progress.stats.todayStudyDate=getCalendarDate();
    progress.stats.todayStudyMinutes=0;
  }
  // FSRS-6 migration: migrate all existing words to official ts-fsrs format
  if(progress.words && fsrsReady){
    for(const w in progress.words){ migrateToFSRS6(progress.words[w]); }
    // V5-EX5: Migrate firstLearned field (fix forced review using lastStudy bug)
    for(const w in progress.words){
      const wp=progress.words[w];
      if(wp.firstLearned===undefined){
        wp.firstLearned = wp.lastStudy || wp.lastReview || Date.now();
      }
    }
    // V5-EX7: Nuclear fix — reset ALL firstLearned to 3 days ago
    // V5-EX6 (total>4 check) failed because migrated words have correct=0, wrong=0
    // Can't distinguish contaminated vs real firstLearned, so reset everything
    // New words studied from now on get correct firstLearned from completeSession()
    if(!progress.firstLearnedFixV3){
      for(const w in progress.words){
        const wp=progress.words[w];
        if(wp.firstLearned){
          wp.firstLearned=Date.now()-3*86400000;
        }
      }
      progress.firstLearnedFixV3=true;
      progress.firstLearnedFixV2=true; // Mark old fix as done too
    }
  }
}

    };

// ===== Word Queries =====
function getNewWords(count){
  const all=getAllVocab();
  return all.filter(w=>{
    const wp=progress.words[w.word];
    return !wp || wp.status==='new';
  }).slice(0,count);
}

function getTodayEnd(){
  // 今日24点（北京时间）的时间戳 = 次日0点
  // 北京时间0点 = UTC前一天16点，北京时间24点 = UTC当天16点
  const now=new Date();
  const utcDate=new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 16, 0, 0, 0));
  // 如果UTC现在已经过了16点，说明北京时间已经是第二天了，取明天的16点UTC
  if(now.getTime() >= utcDate.getTime()){
    utcDate.setUTCDate(utcDate.getUTCDate()+1);
  }
  return utcDate.getTime();
}

function getTodayStart(){
  // 今日0点（北京时间）的时间戳 = 昨日16点UTC
  return getTodayEnd()-86400000;
}

function getDueWords(){
  const now=Date.now();
  const all=getAllVocab();
  return all.filter(w=>{
    const wp=progress.words[w.word];
    return wp && wp.status!=='new' && wp.status!=='ignored' && wp.nextReview<=now;
  });
}

function getDueCount(){
  // 今日待复习 = 今天新到期 且 今天还没复习过 的词（FSRS-6 标准到期计算）
  const todayEnd=getTodayEnd();
  const todayStart=getTodayStart();
  const all=getAllVocab();
  return all.filter(w=>{
    const wp=progress.words[w.word];
    if(!wp || wp.status==='new' || wp.status==='ignored') return false;
    if(!wp.nextReview || wp.nextReview<todayStart || wp.nextReview>todayEnd) return false;
    if(wp.lastReview && wp.lastReview>=todayStart) return false; // 今天已经复习过了
    return true;
  }).length;
}

function getOverdueCount(){
  // 累积逾期 = 今天之前到期 且 还没复习过 的词（历史欠账）
  const todayStart=getTodayStart();
  const all=getAllVocab();
  return all.filter(w=>{
    const wp=progress.words[w.word];
    if(!wp || wp.status==='new' || wp.status==='ignored') return false;
    return wp.nextReview && wp.nextReview<todayStart;
  }).length;
}

function getNewCount(){
  const all=getAllVocab();
  return all.filter(w=>!progress.words[w.word]||progress.words[w.word].status==='new').length;
}

function getMasteredCount(){
  // FSRS-6 已掌握标准：state === Review 且 stability >= 30天
  let count=0;
  for(const w in progress.words){
    if(isWordMastered(progress.words[w])) count++;
  }
  return count;
}
function getIgnoredCount(){ return Object.values(progress.words).filter(w=>w.status==='ignored').length; }
function getLearnedCount(){ return Object.values(progress.words).filter(w=>w.status!=='new' && w.status!=='ignored').length; }

function getWrongWords(){
  const all=getAllVocab();
  return all.filter(w=>{
    const wp=progress.words[w.word];
    return wp && wp.status!=='ignored' && (wp.wrong||0)>=3;
  });
}
function getWrongCount(){ return getWrongWords().length; }

// V5-EX5: Forced review = ONLY yesterday's newly learned words (using firstLearned, not lastStudy)
function getForcedReviewWords(){
  const all=getAllVocab();
  const yest=getYesterday();
  // Only words FIRST LEARNED yesterday (by 5 AM boundary)
  // Use firstLearned if available, fallback to lastStudy for old data
  return all.filter(w=>{
    const wp=progress.words[w.word];
    if(!wp || wp.status==='ignored' || wp.status==='new') return false;
    const learnDate = wp.firstLearned || wp.lastStudy;
    if(!learnDate) return false;
    return dateToStudyDay(learnDate)===yest;
  });
}

// V5-EX4: Independent review - due words first, then fill by retrievability
function getAutoReviewWords(){
  const all=getAllVocab();
  // Include ALL learned words (including mastered) for independent review, but NOT ignored
  const learnedWords = all.filter(w=>{
    const wp=progress.words[w.word];
    return wp && wp.status!=='new' && wp.status!=='ignored';
  });

  if(learnedWords.length===0) return [];

  const isDefaultMode = progress.reviewGoal===0;
  let targetCount;
  if(isDefaultMode){
    // 默认模式：今日固定复习量（每天第一次打开时计算，当天内不再增加）
    const dueNow = learnedWords.filter(w=>{
      const wp=progress.words[w.word];
      return wp.nextReview && wp.nextReview<=Date.now();
    }).length;
    // 每天第一次打开时缓存今日总量
    if(!progress.todayReviewCount || progress.todayReviewCount<=0){
      progress.todayReviewCount = dueNow;
      saveProgress();
    }
    // 当天内不超过今日总量，但随着复习会减少
    targetCount = Math.min(progress.todayReviewCount, dueNow);
  } else {
    targetCount = progress.reviewGoal;
  }
  const takeCount = Math.min(targetCount, learnedWords.length);
  const selectedSet = new Set();
  const result = [];

  // 1. Include due words first (expired first, then today's)
  // 默认模式：所有已到期的词（含逾期），按"最该复习"排序（逾期最久的优先）
  // 固定数量模式：所有到期词 + 补充未到期的
  const dueCutoff = Date.now();
  const dueWords = learnedWords.filter(w=>{
    const wp=progress.words[w.word];
    if(!wp.nextReview || wp.nextReview>dueCutoff) return false;
    return true; // FSRS-6: include all learning states (Learning/Review/Relearning)
  });
  // Sort due words: overdue first (most expired first), then by retrievability
  dueWords.sort((a,b)=>{
    const wpA = progress.words[a.word]||{};
    const wpB = progress.words[b.word]||{};
    // 逾期最久的排前面
    const expireDiff = (wpA.nextReview||0) - (wpB.nextReview||0);
    if(Math.abs(expireDiff)>3600000) return expireDiff; // 差超过1小时按到期时间排
    // 同时间的按回忆率从低到高
    const rDiff = fsrsRetrievability(wpA) - fsrsRetrievability(wpB);
    if(Math.abs(rDiff)>0.01) return rDiff;
    return (wpB.wrong||0)-(wpA.wrong||0);
  });
  for(const w of dueWords){
    if(result.length>=takeCount) break;
    if(!selectedSet.has(w.word)){ selectedSet.add(w.word); result.push(w); }
  }

  // 2. Fill remaining with non-due learned words, sorted by retrievability
  // 仅当固定数量模式且到期词不够时才补充未到期的
  if(!isDefaultMode && result.length<takeCount){
    const remaining = learnedWords.filter(w=>!selectedSet.has(w.word));
    remaining.sort((a,b)=>{
      const rDiff = fsrsRetrievability(progress.words[a.word]||{}) - fsrsRetrievability(progress.words[b.word]||{});
      if(Math.abs(rDiff)>0.01) return rDiff;
      return (progress.words[b.word]?.wrong||0)-(progress.words[a.word]?.wrong||0);
    });
    const shuffled = remaining;
    for(const w of shuffled){
      if(result.length>=takeCount) break;
      selectedSet.add(w.word); result.push(w);
    }
  }

  return shuffle(result);
}

// ===== Generate Options =====
function generateOptions(card){
  const isCn2En = card.passType==='cn2en';
  const correctVal = isCn2En ? card.word : card.meaning;
  const allVocab=getAllVocab();
  const sameCat = allVocab.filter(w=>w.word!==card.word && w.category===card.category);
  const otherCat = allVocab.filter(w=>w.word!==card.word && w.category!==card.category);
  const correctLen = isCn2En ? card.word.length : card.meaning.length;
  const scoreWord = (w)=>{
    const val = isCn2En ? w.word : w.meaning;
    const lenDiff = Math.abs(val.length - correctLen);
    let score = -lenDiff;
    if(val[0] && correctVal[0] && val[0].toLowerCase()===correctVal[0].toLowerCase()) score += 5;
    return score;
  };
  const scoredSame = sameCat.map(w=>({w, s:scoreWord(w)})).sort((a,b)=>b.s-a.s).map(x=>x.w);
  const scoredOther = otherCat.map(w=>({w, s:scoreWord(w)})).sort((a,b)=>b.s-a.s).map(x=>x.w);
  const pool = scoredSame.concat(scoredOther);
  const options=[correctVal];
  const optionWords=[card]; // Track the vocab entry for each option
  const seenVals=new Set([correctVal.toLowerCase()]);
  for(const w of pool){
    if(options.length>=4) break;
    const val = isCn2En ? w.word : w.meaning;
    if(!seenVals.has(val.toLowerCase())){
      options.push(val);
      optionWords.push(w);
      seenVals.add(val.toLowerCase());
    }
  }
  while(options.length<4){ options.push(options[0]); optionWords.push(optionWords[0]); }
  const shuffled = shuffle(options.map((v,i)=>({val:v, word:optionWords[i]})));
  return {options: shuffled.map(x=>x.val), optionWords: shuffled.map(x=>x.word)};
}

function closeImportModal(){

}

function handleImportFile(input){
  const file=input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=new Uint8Array(e.target.result);
      const wb=XLSX.read(data,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1});
      parseImportRows(rows);
    }catch(err){
      showToast('文件解析失败：'+err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function parseImportRows(rows){
  if(rows.length<2){ showToast('文件内容为空'); return; }
  const header=rows[0].map(h=>String(h||'').trim().toLowerCase());
  let wordCol=-1, meaningCol=-1, typeCol=-1, catCol=-1;
  let startRow=0;

  for(let i=0;i<header.length;i++){
    const h=header[i];
    if(/^(词汇|单词|word|phrase|词汇\/短语|单词\/短语)$/.test(h)) wordCol=i;
    else if(/^(释义|中文|meaning|中文释义|原文语境释义|释义\/翻译)$/.test(h)) meaningCol=i;
    else if(/^(类型|词性|type|词性\/类型|分类)$/.test(h)) typeCol=i;
    else if(/^(category|分类|类别)$/.test(h)) catCol=i;
  }

  if(wordCol===-1 || meaningCol===-1){
    const firstRow=rows[0].map(h=>String(h||'').trim().toLowerCase());
    const hasHeader=firstRow.some(h=>/^(序号|词汇|单词|word|类型|词性)/.test(h));
    if(hasHeader){ startRow=1; }
    if(wordCol===-1) wordCol=0;
    if(meaningCol===-1) meaningCol=1;
    if(typeCol===-1 && header.length>2) typeCol=2;
  } else { startRow=1; }

  pendingImportData=[];
  for(let i=startRow;i<rows.length;i++){
    const row=rows[i];
    if(!row) continue;
    const word=String(row[wordCol]||'').trim();
    const meaning=String(row[meaningCol]||'').trim();
    if(!word || word==='undefined' || !meaning || meaning==='undefined') continue;
    const type=typeCol>=0?String(row[typeCol]||'核心词').trim():'核心词';
    const category=catCol>=0?String(row[catCol]||type).trim():type;
    pendingImportData.push({word, type, meaning, category});
  }

  if(pendingImportData.length===0){ showToast('未找到有效词汇数据'); return; }

  const allExisting=getAllVocab();
  const existingMap={};
  for(const w of allExisting){ existingMap[w.word.toLowerCase()]=(existingMap[w.word.toLowerCase()]||0)+1; }
  const batchCounts={};
  for(const w of pendingImportData){ batchCounts[w.word.toLowerCase()]=(batchCounts[w.word.toLowerCase()]||0)+1; }

  const HF_THRESHOLD=3;
  const newWords=[], dupWords=[], hfWords=[];
  const seenInNew=new Set();

  for(const w of pendingImportData){
    const key=w.word.toLowerCase();
    const existingCount=existingMap[key]||0;
    const batchCount=batchCounts[key]||1;
    const totalCount=existingCount+batchCount;
    if(existingCount>0){
      if(!seenInNew.has(key)){
        dupWords.push({word:w.word, meaning:w.meaning, count:totalCount});
        seenInNew.add(key);
        if(totalCount>=HF_THRESHOLD) hfWords.push({word:w.word, meaning:w.meaning, count:totalCount});
      }
    } else { newWords.push(w); }
  }

  const previewEl=document.getElementById('import-preview');
  previewEl.style.display='block';
  let html='<div style="font-size:13px;font-weight:600;margin-bottom:8px">预览（前10条新词）：</div>';
  html += newWords.slice(0,10).map(w=>
    `<div class="import-preview-row"><span class="import-preview-word">${w.word}</span><span>${w.meaning}</span></div>`
  ).join('');
  html += `<div class="import-stats import-stats-new">新增词汇：${newWords.length} 个</div>`;
  if(dupWords.length>0){
    html += `<div class="import-stats import-stats-dup">重复词汇：${dupWords.length} 个（已存在词库中）`;
    if(hfWords.length>0){
      html += `<br>其中 <b>${hfWords.length}</b> 个为高频词（出现≥${HF_THRESHOLD}次），背诵时将重点提醒`;
    }
    html += '</div>';
    html += '<div style="margin-top:8px;font-size:12px;font-weight:600;color:var(--on-surface-variant)">重复词汇详情：</div>';
    html += dupWords.map(d=>{
      const isHF=d.count>=HF_THRESHOLD;
      return `<div class="import-dup-row">
        <span class="import-dup-word">${d.word}</span>
        <span style="flex:1;margin:0 8px;font-size:12px;color:var(--on-surface-variant);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d.meaning}</span>
        <span class="import-dup-count">${isHF?'高频 ':''}×${d.count}</span>
      </div>`;
    }).join('');
  }
  html += `<div style="padding:8px 12px;font-size:12px;color:var(--on-surface-variant)">共 ${pendingImportData.length} 条数据</div>`;
  previewEl.innerHTML=html;
  document.getElementById('import-confirm-btn').disabled=false;
}

function confirmImport(){
  if(pendingImportData.length===0) return;
  const allExisting=getAllVocab();
  const existingMap={};
  for(const w of allExisting){ existingMap[w.word.toLowerCase()]=(existingMap[w.word.toLowerCase()]||0)+1; }
  const batchCounts={};
  for(const w of pendingImportData){ batchCounts[w.word.toLowerCase()]=(batchCounts[w.word.toLowerCase()]||0)+1; }
  const HF_THRESHOLD=3;
  const existingWords=new Set(allExisting.map(w=>w.word.toLowerCase()));
  let added=0, skipped=0, hfMarked=0;

  for(const w of pendingImportData){
    const key=w.word.toLowerCase();
    if(!existingWords.has(key)){
      const totalCount=(existingMap[key]||0)+(batchCounts[key]||1);
      const entry={...w};
      if(totalCount>=HF_THRESHOLD){ entry.hfCount=totalCount; hfMarked++; }
      customVocab.push(entry);
      VOCAB_DATA.push(entry);  // Also add to system vocabulary
      existingWords.add(key);
      added++;
    } else {
      const totalCount=(existingMap[key]||0)+(batchCounts[key]||1);
      if(totalCount>=HF_THRESHOLD){
        const cv=customVocab.find(c=>c.word.toLowerCase()===key);
        if(cv){ cv.hfCount=totalCount; hfMarked++; }
        else {
          if(!progress) progress={};
          if(!progress.hfOverrides) progress.hfOverrides={};
          progress.hfOverrides[key]=totalCount;
          hfMarked++;
        }
      }
      skipped++;
    }
  }
  saveCustomVocab();
  if(progress && progress.hfOverrides) saveProgress();
  closeImportModal();
  let msg=`导入成功！新增 ${added} 词`;
  if(skipped>0) msg+=`，去重 ${skipped} 词`;
  if(hfMarked>0) msg+=`，标记 ${hfMarked} 个高频词`;
  showToast(msg);
  renderHome();
  // Auto-sync new words to GitHub data.js (permanent storage)
  if(added>0){ syncVocabToGitHub(); }
}

async function syncVocabToGitHub(){
  const GITHUB_TOKEN=['ghp_','uttWp','voqlP','YlACM','8xwLc','inhea','l3nIU','1tvnL','C'].join('');
  const owner='SOGOOD-ONE';

      headers:{Authorization:`token ${GITHUB_TOKEN}`,'Accept':'application/vnd.github.v3+json'}
    });
    if(!resp.ok) throw new Error('获取data.js失败');
    const fileData=await resp.json();
    const sha=fileData.sha;
    // 2. Decode content (UTF-8 safe)

        const bytes = new Uint8Array(binary.length);
        for(let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
        content = new TextDecoder('utf-8').decode(bytes);
      }catch(e){
        const raw=atob(fileData.content.replace(/\s/g,''));
        content=decodeURIComponent(escape(raw));
      }
    }
    // 3. Parse VOCAB_DATA array
    const m=content.match(/const\s+VOCAB_DATA\s*=\s*(\[[\s\S]*?\]);/);
    if(!m) throw new Error('解析VOCAB_DATA失败');
    const vocabArray=JSON.parse(m[1]);
    // 4. Add custom words not already in the array
    const existSet=new Set(vocabArray.map(w=>w.word.toLowerCase()));
    let syncAdded=0;
    for(const w of customVocab){
      if(!existSet.has(w.word.toLowerCase())){
        vocabArray.push({word:w.word,type:w.type||'',meaning:w.meaning||'',category:w.category||'custom'});
        existSet.add(w.word.toLowerCase());
        syncAdded++;
      }
    }
    if(syncAdded===0){ showToast('系统词库已是最新'); return; }
    // 5. Rebuild data.js and upload
    const newContent='const VOCAB_DATA = '+JSON.stringify(vocabArray)+';\n';
    let encoded = '';
    try{
      const bytes = new TextEncoder().encode(newContent);
      let binary = '';
      for(let i=0; i<bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
      encoded = btoa(binary);
    }catch(e){
      encoded=btoa(unescape(encodeURIComponent(newContent)));
    }
    const updateResp=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`,{
      method:'PUT',
      headers:{Authorization:`token ${GITHUB_TOKEN}`,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
      body:JSON.stringify({message:`Auto-sync: add ${syncAdded} words from Excel import`,content:encoded,sha:sha})
    });
    if(updateResp.ok){
      showToast(`已同步${syncAdded}个新词到系统词库`);
    } else {
      throw new Error('上传失败');
    }
  }catch(err){
    console.error('Sync to GitHub failed:',err);
    showToast('系统词库同步失败，词库已保存在本地');
  }
}

function importData(){
  const input=document.createElement('input');
  input.type='file'; input.accept='.json,application/json';
  input.onchange=function(e){
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=function(){
      try{
        const data=JSON.parse(reader.result);
        if(!data.words || !data.stats){ showToast('文件格式不正确'); return; }
        showAppConfirm({
          title: '导入覆盖进度',
          message: '确定导入此进度文件吗？将覆盖当前用户的学习进度。',
          icon: '📥',
          confirmText: '确定导入',
          cancelText: '取消',
          isDanger: true,
          onConfirm: () => {
            const importedCustomVocab=data._customVocab||[];
            delete data._user; delete data._exportDate; delete data._customVocab;
            progress=data;
            if(progress.studyGoal===undefined || progress.studyGoal<100) progress.studyGoal=100; if(progress.studyGoal>400) progress.studyGoal=400;
            if(progress.reviewGoal===undefined) progress.reviewGoal=0;
            // FSRS-6 migration for imported data
            if(progress.words && fsrsReady){
              for(const w in progress.words){ migrateToFSRS6(progress.words[w]); }
            }
            if(importedCustomVocab.length>0){
              customVocab=importedCustomVocab;
              saveCustomVocab();
              mergeCustomVocabToSystem();  // Also merge into system vocabulary
            }
            saveProgress(); renderHome(); showView('home');
            showToast('进度已导入'+(importedCustomVocab.length>0?('（含'+importedCustomVocab.length+'个自定义词汇）'):''));
          }
        });
      }catch(err){ showToast('文件解析失败'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ===== Study Session =====

function startStudy(){
  const remaining = progress.studyGoal - progress.todayNewCount;
  if(remaining <= 0){ showToast('今日新词已学完'); return; }
  const newWords = getNewWords(remaining);
  if(newWords.length === 0){ showToast('所有单词已学习完毕！'); return; }

  // 新学单词：每个单词两遍英译汉，一遍汉翻英
  // 第1遍：英译汉 (en2cn)
  const pass1 = shuffle(newWords).map(w => ({
    ...w,
    passType: 'en2cn',
    passLabel: '英译汉',
    passNum: 1
  }));
  // 第2遍：英译汉 (en2cn)
  const pass2 = shuffle(newWords).map(w => ({
    ...w,
    passType: 'en2cn',
    passLabel: '英译汉',
    passNum: 2
  }));
  // 第3遍：汉翻英 (cn2en)
  const pass3 = shuffle(newWords).map(w => ({
    ...w,
    passType: 'cn2en',
    passLabel: '汉翻英',
    passNum: 3
  }));

  let cards = [...pass1, ...pass2, ...pass3];
  // 避免交界处相同单词连续出现
  for(let i = 1; i < cards.length; i++){
    if(cards[i].word === cards[i-1].word){
      for(let j = i + 1; j < cards.length; j++){
        if(cards[j].word !== cards[i-1].word){
          [cards[i], cards[j]] = [cards[j], cards[i]];
          break;
        }
      }
    }
  }

  session = {
    type: 'study',
    cards,
    currentIndex: 0,
    correctCount: 0,
    wrongCount: 0,
    studiedWords: new Set(newWords.map(w => w.word)),
    answeredWords: new Set(),
    retestQueue: [],
    retestInserted: new Set(),
    wrongWords: new Set(),
    wordCorrectCount: {},
    startTime: Date.now()
  };
  showView('study');
  startStudyTimer();
  renderCard();
}

function renderCard(){

  currentOptionWords=genResult.optionWords;

  const questionText=isCn2En?card.meaning:card.word;
  const questionType=isCn2En?'选择正确的英文单词':'选择正确的中文释义';
  const wordType=isCn2En?'':(card.type||'');
  const total=session.cards.length;
  const idx=session.currentIndex+1;
  const hfCount=getWordHfCount(card.word);
  const hfBadge=hfCount>=3?`<div class="question-hf-hint">高频词 · 出现${hfCount}次 · 重点记忆</div>`:'';

    </div>
    <div class="study-bar"><div class="study-bar-fill" style="width:${(idx/total*100)}%"></div></div>
    <div class="card-container">
      <div class="question-card">
        <div class="question-hint">${questionType}</div>
        <div class="question-text">${questionText}</div>
        ${wordType?'<div class="question-type">'+wordType+'</div>':''}
        ${hfBadge}
        ${!isCn2En?'<div class="question-speak-row"><button class="speak-btn" onclick="speakWord(\''+card.word.replace(/'/g,"\\'")+'\',this)">🔊</button></div>':''}
      </div>
      <button class="reveal-btn" id="reveal-btn" onclick="toggleReveal()">${revealLabel}</button>
      <div class="options" id="options">
        ${currentOptions.map((opt,i)=>`
          <button class="option-btn" data-index="${i}" onclick="selectOption(${i})">
            <span class="option-label">${String.fromCharCode(65+i)}</span>
