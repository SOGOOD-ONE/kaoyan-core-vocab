// 释义区"全部释义"展开/收起切换（flag 用于切题时强制重置状态）
function toggleMeaning(forceOpen){
  const e=_studyEls;
  if(!e || !e.meaningBox) return;
  if(forceOpen===true){
    e.meaningBox.classList.add('open');
    if(e.moreLabel) e.moreLabel.textContent='收起';
    return;
  }
  if(forceOpen===false){
    e.meaningBox.classList.remove('open');
    if(e.moreLabel) e.moreLabel.textContent='全部释义';
    return;
  }
  const open=e.meaningBox.classList.toggle('open');
  if(e.moreLabel) e.moreLabel.textContent=open?'收起':'全部释义';
}

// 斩词：将单词标记为ignored，不再参与任何复习，但保留在词库和学习记录中
function ignoreCurrentWord(){
  if(!session || !currentCard) return;
  const word=currentCard.word;
  let wp=progress.words[word];
  if(!wp){
    // 学习阶段的新词可能还没写入progress，先创建记录
    wp={status:'ignored', stability:0, difficulty:0, lastReview:Date.now(), nextReview:0, correct:0, wrong:0, firstLearned:Date.now(), lastStudy:Date.now(), fsrs:null, fsrsState:'Ignored'};
    progress.words[word]=wp;
  } else {
    wp.status='ignored';
  }
  if(!progress.stats.totalIgnored) progress.stats.totalIgnored=0;
  progress.stats.totalIgnored++;
  // 从当前会话的卡片列表中移除（包括重测队列中的）
  // 同一个词在一次会话里会出现多张卡（3 遍 pass + 重测），删除时必须把
  // "位于当前卡之前"的卡数从 currentIndex 里扣掉，否则后面的卡会被跳过
  // （表现为点"斩"之后莫名少做一题）
  const removedBefore=session.cards.slice(0, session.currentIndex).filter(c=>c.word===word).length;
  session.cards=session.cards.filter(c=>c.word!==word);
  session.retestQueue=session.retestQueue.filter(c=>c.word!==word);
  if(session.retestInserted) session.retestInserted.delete(word);
  if(session.studiedWords && session.studiedWords.has(word)) session.studiedWords.delete(word);
  // 若删掉的是末尾卡，currentIndex 会等于/超过新长度，交给 renderCard/completeSession 收尾
  session.currentIndex-=removedBefore;
  saveProgress();
  showToast('已斩掉 '+word);
  if(session.cards.length===0){ completeSession(); return; }
  renderCard();
}

function selectOption(index){
  if(answered) return;
  answered=true;
  const card=session.cards[session.currentIndex];
  const isCn2En=card.passType==='cn2en';
  const correctVal=isCn2En?card.word:card.meaning;
  const selectedVal=currentOptions[index];
  const isCorrect=selectedVal.toLowerCase()===correctVal.toLowerCase();
  const e=_studyEls;

  for(let i=0; i<currentOptions.length; i++){
    const btn=e?e.opts[i].btn:document.getElementById('opt-btn-'+i);
    const ico=e?e.opts[i].ico:document.getElementById('opt-ico-'+i);
    if(btn){
      btn.classList.add('disabled');
      if(i===index && isCorrect){
        // 选对：该按钮淡绿 + ✓，其余选项淡化禁用
        btn.classList.add('correct');
        if(ico) ico.textContent='✓';
      } else if(i===index){
        // 选错：按钮红标 + ✕ + 抖动，不展开释义不透题
        btn.classList.add('wrong');
        if(ico) ico.textContent='✕';
      } else {
        btn.classList.add('dimmed');
      }
    }
  }

  if(isCorrect) session.correctCount++; else session.wrongCount++;
  if(session.answeredWords) session.answeredWords.add(card.word);
  // 学习模式记录每个词"首轮 3 遍"的答对数，用来换算复习初评。
  // 必须排除重测卡：否则第 1 遍答错、靠后续重测补对也会凑够 3 次，
  // 被误判为"记得"（间隔拉长）——本该短间隔巩固的新词反而被推远。
  if(session.type==='study' && isCorrect && session.wordCorrectCount && !card.isRetest){
    session.wordCorrectCount[card.word] = (session.wordCorrectCount[card.word]||0) + 1;
  }

  const isReviewMode = session.type==='review' || session.type==='auto' || session.type==='wrong';

  // For review modes: track session-level counts only. 单词级的 correct/wrong
  // 与总统计(totalCorrect/totalWrong)不在答题瞬间累计——由用户按的"模糊/记得"
  // 评分在 applyReviewRating 里统一定账，否则会出现"答对却按模糊→间隔重置、
  // 却被记成正确"的统计与调度脱节，重测卡还会重复累计。
  if(isReviewMode){
    session.reviewResults[card.word]=isCorrect;
  }

  // For non-review modes (study): add wrong words to retest queue
  if(!isReviewMode && !isCorrect && !session.retestInserted.has(card.word)){
    const retestCard={...card, passType:Math.random()<0.5?'cn2en':'en2cn', passLabel:Math.random()<0.5?'汉选英':'英选汉', passNum:0, isRetest:true, retestDelay:3+Math.floor(Math.random()*3)};
    session.retestQueue.push(retestCard);
    session.retestInserted.add(card.word);
  }

  // 选对才展开释义区，且重置为收起的一行态；选错不展开、不透题
  if(isCorrect && e && e.meaningBox){
    e.meaningBox.classList.add('show');
    if(e.moreLabel) e.moreLabel.textContent='全部释义';
    e.meaningBox.classList.remove('open');
  }

  // 结果区只放继续按钮（学习模式）或评分面板（复习模式）
  let resultHtml='';
  if(isReviewMode){
    // 选错参与评分：答题实际对错不能靠用户按"记得"蒙混过关。
    // 答错时给出提示并禁用"记得"，评分强制按"模糊"(Again)处理。
    const wrongHint = !isCorrect
      ? `<div class="fsrs-rating-hint">本题答错 · 评分按「模糊」处理（1 天后优先再复习）</div>` : '';
    const goodDisabled = !isCorrect ? ' disabled' : '';
    resultHtml=`<div class="fsrs-rating-panel" id="fsrs-rating-panel">
      ${wrongHint}
      <div class="fsrs-rating-grid">
        <button class="fsrs-rating-btn kw-ignore-inline" onclick="ignoreCurrentWord()">斩</button>
        <button class="fsrs-rating-btn again" data-rating="1" onclick="applyReviewRating(1)">模糊</button>
        <button class="fsrs-rating-btn good" data-rating="3"${goodDisabled} onclick="applyReviewRating(3)">记得</button>
      </div>
    </div>`;
  }else{
    resultHtml=`<div class="fsrs-rating-panel">
      <div class="fsrs-rating-grid">
        <button class="fsrs-rating-btn kw-ignore-inline" onclick="ignoreCurrentWord()">斩</button>
        <button class="fsrs-rating-btn" onclick="nextCard()">${isCorrect?'正确 · 继续':'错误 · 继续'}</button>
      </div>
    </div>`;
  }

  if(e && e.resArea){
    e.resArea.innerHTML = resultHtml;
  }

  if(isCorrect){
    setTimeout(()=>{ speakWord(card.word); }, 180);
  }

  saveProgress();
  saveSession();
}

// 两档评分：点"模糊"或"记得"后应用艾宾浩斯调度结果
function applyReviewRating(ratingNumber){
  if(!session || !currentCard || !answered) return;
  if(session.ratingApplied) return;
  session.ratingApplied=true;
  const api=fsrsApi();
  const ratingMap={1:api.Rating.Again,3:api.Rating.Good};
  // 选错参与评分：本题答错时强制按"模糊"(Again)处理——不能靠点"记得"蒙混过关。
  // selectOption 已禁用"记得"按钮，这里在评分入口再兜底一次（键盘/程序触发等）。
  // 答错 → 重置 1 天 + 插入重测卡，天然保证"选错的词下次复习优先出现"。
  const answeredWrong = session.reviewResults && session.reviewResults[currentCard.word]===false;
  const rating = answeredWrong ? api.Rating.Again : ratingMap[ratingNumber];
  const wp=progress.words[currentCard.word];
  if(!wp || rating===undefined){ session.ratingApplied=false; return; }
  // 单词级 correct/wrong 与总统计按用户点的评分统一定账，排除重测卡
  // (重测卡只是首次"模糊"后的补测，再记一次会让同一词重复累计)。
  if(!(currentCard && currentCard.isRetest)){
    if(rating===api.Rating.Good){ wp.correct=(wp.correct||0)+1; progress.stats.totalCorrect=(progress.stats.totalCorrect||0)+1; }
    else{ wp.wrong=(wp.wrong||0)+1; progress.stats.totalWrong=(progress.stats.totalWrong||0)+1; }
  }
  // 调度器缺失时 applyFSRSRating 会静默返回原卡（不做任何调度），
  // 若不在这里拦住，用户会以为评分生效，实际到期时间从未更新
  if(!getFSRSScheduler()){
    session.ratingApplied=false;
    showToast('调度器未就绪，请刷新页面后重试');
    return;
  }

  // Capture state before
  const beforeCard=getFSRSCard(wp);
  const before=serializeFSRSCard(beforeCard);
  const wasMastered=isWordMastered(wp);

  try{
    // Apply FSRS rating
    const {result}=applyFSRSRating(wp,rating,Date.now());

    if(isWordMastered(wp) && !wasMastered && progress.stats){
      progress.stats.totalMastered=(progress.stats.totalMastered||0)+1;
    }

    // Update review results
    session.reviewResults[currentCard.word]={rating:ratingNumber,ratingName:fsrsRatingName(rating),state:wp.fsrsState};

    // Update rating panel to show brief confirmation then auto-advance
    const panel=document.getElementById('fsrs-rating-panel');
    if(panel){
      const ratingBtns=panel.querySelectorAll('.fsrs-rating-btn');
      ratingBtns.forEach(btn=>{
        btn.disabled=true;
        if(btn.dataset.rating == ratingNumber){
          btn.classList.add('active-selected');
        }
      });
      // Snappy transition (160ms)
      if(_advanceTimer) clearTimeout(_advanceTimer);
      _advanceTimer=setTimeout(()=>{ nextCardAfterRating(); }, 160);
    }

    // Handle retest: Again rating adds to retest queue
    if(rating===api.Rating.Again && !session.retestInserted.has(currentCard.word)){
      const card=currentCard;
      const retestCard={...card, passType:Math.random()<0.5?'cn2en':'en2cn', passLabel:Math.random()<0.5?'汉选英':'英选汉', passNum:0, isRetest:true, retestDelay:3+Math.floor(Math.random()*3)};
      session.retestQueue.push(retestCard);
      session.retestInserted.add(card.word);
    }

    saveProgress();
    saveSession();
  }catch(e){
    console.error(e);
    session.ratingApplied=false;
    showToast('调度失败，请重试');
  }
}

// 自动前进定时器：手动前进（键盘 Enter / 按钮）时必须能取消它，
// 否则同一次作答会被推进两张卡，最后一题还会重复结算一次
let _advanceTimer=null;
let _lastAdvanceAt=0;

function nextCardAfterRating(){
  _advanceTimer=null;
  nextCard();
}

function nextCard(){
  if(!session || !session.cards) return;   // 会话已退出/已结束，别让残留定时器抛错
  const now=Date.now();
  if(now-_lastAdvanceAt<120) return;       // 防连点跳题 (120ms)
  _lastAdvanceAt=now;
  if(_advanceTimer){ clearTimeout(_advanceTimer); _advanceTimer=null; }
  session.currentIndex++;
  if(session.retestQueue.length>0){
    const remaining=session.cards.length - session.currentIndex;
    const nextRetest=session.retestQueue[0];
    // Delay-based insertion: wait 3-5 cards before retesting (respect spacing)
    nextRetest.retestDelay = (nextRetest.retestDelay||3) - 1;
    // Insert when delay expires, or when not enough cards remain to satisfy delay
    const insertNow = nextRetest.retestDelay<=0 || remaining<=nextRetest.retestDelay;
    if(insertNow){
      session.cards.splice(session.currentIndex, 0, nextRetest);
      session.retestQueue.shift();
      session.retestInserted.delete(nextRetest.word);
    }
  }
  if(session.currentIndex>=session.cards.length){
    if(session.retestQueue.length>0){
      const retestCards=session.retestQueue.map(rc=>{ session.retestInserted.delete(rc.word); return {...rc}; });
      session.cards.push(...retestCards);
      session.retestQueue=[];
      renderCard(); return;
    }
    completeSession();
  } else { renderCard(); }
}

function exitStudy(){
  saveSessionExit();
}

function saveSessionExit(){
  try{ saveStudyTime(); }catch(e){}
  try{ stopStudyTimer(); }catch(e){}
  if(_advanceTimer){ clearTimeout(_advanceTimer); _advanceTimer=null; }
  try{
    if(session && session.cards && session.currentIndex < session.cards.length){
      saveSession();
      // 必须立刻落盘：下面马上会把 session 置空，
      // 若留给延迟写入，写盘时看到 session 为空就会变成“删除会话”，
      // 首页的“继续学习”横幅会永久失效
      flushPersistence();
    }else{
      clearSession();
    }
  }catch(e){}
  try{ saveProgress(); }catch(e){}
  session=null;
  try{ renderHome(); }catch(e){ console.error(e); }
  showView('home');
  showToast('学习进度已保存，可在首页继续');
}

function resumeSession(){
  const s=loadSession();
  if(!s || !s.cards || s.currentIndex>=s.cards.length){
    showToast('无法恢复学习进度'); clearSession(); renderHome(); return;
  }
  // Handle interrupted session: if gap > 5 min, save previous time and start fresh
  const now=Date.now();
  const lastActive=s.lastActiveTime||s.startTime||now;
  const gap=now-lastActive;
  if(gap>5*60*1000){
    // Session was interrupted: save the time before interruption to stats
    const interruptedDuration=lastActive-(s.startTime||lastActive);
    if(interruptedDuration>0){
      const minutes=Math.max(1,Math.round(interruptedDuration/60000));
      const today=getToday();
      if(!progress.stats.todayStudyDate || progress.stats.todayStudyDate!==today){
        progress.stats.todayStudyDate=today;
        progress.stats.todayStudyMinutes=0;
      }
      progress.stats.todayStudyMinutes=(progress.stats.todayStudyMinutes||0)+minutes;
      progress.stats.totalStudyMinutes=(progress.stats.totalStudyMinutes||0)+minutes;
      saveProgress();
    }
    // Start a new time segment (accumulatedTime reset to 0, already saved to stats)
    s.accumulatedTime=0;
    s.startTime=now;
  }
  session=s;
  showView('study');
  startStudyTimer();
  renderCard();
}

function discardSession(){
  stopStudyTimer();
  if(_advanceTimer){ clearTimeout(_advanceTimer); _advanceTimer=null; }
  clearSession(); renderHome();
  showToast('已放弃未完成的学习');
}

// ===== Complete =====
function startStudyTimer(){
  stopStudyTimer();
  let timerEl=document.getElementById('study-timer-float');
  if(!timerEl){
    timerEl=document.createElement('div');
    timerEl.id='study-timer-float';
    timerEl.className='study-timer';
    document.body.appendChild(timerEl);
  }
  const update=()=>{
    if(!session || !session.startTime){ stopStudyTimer(); return; }
    const elapsed=(session.accumulatedTime||0)+(Date.now()-session.startTime);
    const sec=Math.floor(elapsed/1000);
    const m=Math.floor(sec/60);
    const s=sec%60;
    timerEl.textContent='⏱ '+(m>0?m+'分':'')+s+'秒';
  };
  update();
  studyTimerInterval=setInterval(update, 1000);
}

function stopStudyTimer(){
  if(studyTimerInterval){ clearInterval(studyTimerInterval); studyTimerInterval=null; }
  const timerEl=document.getElementById('study-timer-float');
  if(timerEl) timerEl.remove();
}

function getSessionMinutes(){
  if(!session || !session.startTime) return 0;
  const totalMs=(session.accumulatedTime||0)+(Date.now()-session.startTime);
  return Math.max(1, Math.round(totalMs/60000));
}

function saveStudyTime(){
  const minutes=getSessionMinutes();
  const today=getToday();
  if(!progress.stats.todayStudyDate || progress.stats.todayStudyDate!==today){
    progress.stats.todayStudyDate=today;
    progress.stats.todayStudyMinutes=0;
  }
  progress.stats.todayStudyMinutes=(progress.stats.todayStudyMinutes||0)+minutes;
  progress.stats.totalStudyMinutes=(progress.stats.totalStudyMinutes||0)+minutes;
}

function completeSession(){
  try{
    if(session.type==='study'){
      const now=Date.now();
      let newLearned=0;
      // 空卡与调度器对所有新词都相同：scheduler.next() 不会修改入参，
      // 循环外建一次即可，避免每个词都 createEmptyCard
      const api=fsrsApi();
      const scheduler=getFSRSScheduler();
      const emptyCard=api.createEmptyCard();
      session.studiedWords.forEach(word=>{
        try{
          const wp=progress.words[word];
          if(!wp || wp.status==='new'){
            // 学习首轮表现换算两档评分（3次全对→记得，有错→模糊）
            const correctInStudy = session.wordCorrectCount ? (session.wordCorrectCount[word]||0) : 0;
            const rating=fsrsRatingFromStudyResult(correctInStudy);
            const result=scheduler ? scheduler.next(emptyCard,new Date(now),rating) : {card:emptyCard};
            const newWp={
              status:'review',
              level:rating===api.Rating.Good?1:0,
              correct:correctInStudy,
              wrong:Math.max(0, 3 - correctInStudy),
              firstLearned:now,
              lastStudy:now,
              fsrs:serializeFSRSCard(result.card),
              stability:result.card.stability||0,
              difficulty:result.card.difficulty||0,
              lastReview:result.card.last_review?result.card.last_review.getTime():now,
              nextReview:result.card.due?result.card.due.getTime():(now+86400000),
              fsrsState:fsrsStateName(result.card.state),
              fsrsRating:fsrsRatingName(rating)
            };
            progress.words[word]=newWp;
            newLearned++;
          }
        }catch(e){
          console.error('Error processing word in completeSession:', word, e);
        }
      });
      progress.todayNewCount+=newLearned;
      progress.stats.totalLearned+=newLearned;
      progress.stats.totalCorrect+=session.correctCount;
      progress.stats.totalWrong+=session.wrongCount;
    }
    const today=getToday();
    if(progress.stats.lastStudyDate!==today){
      const yStr=getYesterday();
      if(progress.stats.lastStudyDate===yStr) progress.stats.streak=(progress.stats.streak||0)+1;
      else progress.stats.streak=1;
      progress.stats.lastStudyDate=today;
    }
    saveStudyTime();
    stopStudyTimer();
    if(_advanceTimer){ clearTimeout(_advanceTimer); _advanceTimer=null; }
    saveProgress(); clearSession();
    renderComplete();
  }catch(e){
    console.error('completeSession error:', e);
    // Ensure session is cleared even on error
    try{ clearSession(); }catch(_){}
    try{ stopStudyTimer(); }catch(_){}
    session=null;
    renderHome();
    showToast('学习结束，进度已保存');
  }
}

function renderComplete(){
  const total=session.totalCardCount || session.cards.length;
  const correct=session.correctCount;
  const wrong=session.wrongCount;
  const accuracy=total>0?Math.round(correct/total*100):0;
  let nextReviewText='';
  const sessionType=session.type;
  if(sessionType==='study') nextReviewText='这些单词将在明天进入复习';
  else if(sessionType==='auto') nextReviewText='自主复习完成！继续保持';
  else {
    // 与主页"待复习"口径保持一致：到期 + 逾期 + 已掌握词补充。
    // 若只统计到期词，会漏掉补充量，出现"主页显示还有 5 词、完成页却说今日已复习完"的矛盾
    const st=computeHomeStats();
    const dc=st.dueCount+st.overdueCount+st.supplementCount;
    nextReviewText=dc>0?'还有 '+dc+' 个单词待复习':'今日复习已完成，请明天再来';
  }
  const title= sessionType==='study' ? '学习完成！' : (sessionType==='auto' ? '自主复习完成！' : '复习完成！');
  const sessionMin=getSessionMinutes();
  const todayMin=progress.stats.todayStudyMinutes||0;
  const totalMin=progress.stats.totalStudyMinutes||0;
  const html=`
    <div class="complete-container">
      <div class="complete-icon">✓</div>
      <div class="complete-title">${title}</div>
      <div class="complete-subtitle">${sessionType==='study'?'完成了 '+session.studiedWords.size+' 个新词的学习':'完成了 '+total+' 个单词的复习'}</div>
      <div class="complete-stats">
        <div class="complete-stat"><div class="complete-stat-num green">${correct}</div><div class="complete-stat-label">正确</div></div>
        <div class="complete-stat"><div class="complete-stat-num red">${wrong}</div><div class="complete-stat-label">错误</div></div>
        <div class="complete-stat"><div class="complete-stat-num">${total}</div><div class="complete-stat-label">总数</div></div>
      </div>
      <div class="complete-accuracy">正确率 <span>${accuracy}%</span></div>
      <div class="timer-card" style="margin:12px 0">
        <div class="timer-item today">
          <div class="timer-num">${sessionMin}<span class="timer-unit"> 分钟</span></div>
          <div class="timer-label">本次时长</div>
        </div>
        <div class="timer-item today">
          <div class="timer-num">${todayMin}<span class="timer-unit"> 分钟</span></div>
          <div class="timer-label">今日时长</div>
        </div>
        <div class="timer-item">
          <div class="timer-num">${totalMin}<span class="timer-unit"> 分钟</span></div>
          <div class="timer-label">累计时长</div>
        </div>
      </div>
      <div class="next-review-info">${nextReviewText}</div>
      <button class="action-btn primary" style="width:100%" onclick="session=null;renderHome();showView('home')">返回首页</button>
    </div>`;
  document.getElementById('view-complete').innerHTML=html;
  showView('complete');
}

// ===== Keyboard =====
document.addEventListener('keydown',e=>{
  const studyView = document.getElementById('view-study');
  if(studyView && studyView.classList.contains('active')){
    const isReviewMode = session && (session.type==='review' || session.type==='auto' || session.type==='wrong');
    if(!answered){
      if(['1','2','3','4','a','b','c','d','A','B','C','D'].includes(e.key)){
        const idx = '1234'.indexOf(e.key)>=0 ? parseInt(e.key)-1 : 'abcdABCD'.indexOf(e.key)%4;
        if(idx>=0 && idx<currentOptions.length) selectOption(idx);
      } else if(e.key===' ' || e.key==='Tab'){
        e.preventDefault();
        toggleReveal();
      }
    } else {
      if(isReviewMode && !session.ratingApplied && ['1','3'].includes(e.key)){
        e.preventDefault();
        applyReviewRating(parseInt(e.key));
      } else if(e.key==='Enter' || e.key===' '){
        e.preventDefault();
        if(isReviewMode && !session.ratingApplied){
          applyReviewRating(3); // 默认记得
        } else {
          nextCard();
        }
      }
    }
    if(e.key==='Escape') exitStudy();
  }
});

// ===== Load Remote Vocab =====
async function loadRemoteVocab(){
  // 1. If full vocabulary is already loaded into window.VOCAB_DATA, use it immediately
  if(typeof VOCAB_DATA !== 'undefined' && Array.isArray(VOCAB_DATA) && VOCAB_DATA.length > 50){
    console.log(`Vocab loaded from local data: ${VOCAB_DATA.length} words`);
    return;
  }
  // 2. Otherwise load local ./data.js
  // 注意：必须用相对路径。GitHub Pages 部署在子目录（/kaoyan-core-vocab/）下，
  // 绝对路径 /data.js 会请求站点根目录导致 404，被迫回退到限流的 GitHub API
  try{
    const localResp = await fetch('./data.js?v=20260916');
    if(localResp.ok){
      const text = await localResp.text();
      const m = text.match(/const\s+VOCAB_DATA\s*=\s*(\[[\s\S]*?\]);/);
      if(m){
        const parsed = JSON.parse(m[1]);
        if(typeof VOCAB_DATA === 'undefined'){
          window.VOCAB_DATA = parsed;
        } else if(Array.isArray(VOCAB_DATA)){
          const existing = new Set(VOCAB_DATA.map(w=>w.word.toLowerCase()));
          for(const w of parsed){
            if(!existing.has(w.word.toLowerCase())){
              VOCAB_DATA.push(w);
              existing.add(w.word.toLowerCase());
            }
          }
        }
        console.log(`Vocab loaded from /data.js: ${(VOCAB_DATA||parsed).length} words`);
        return;
      }
    }
  }catch(e){
    // ignore
  }

  // 3. Fallback to remote repo only if local data is unavailable
  // 公开仓库的 contents 接口无需鉴权即可读取（未鉴权有 60 次/小时限流）
  const owner='SOGOOD-ONE';
  const repo='kaoyan-core-vocab';
  const path='data.js';
  try{
    const resp=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`,{
      headers:{'Accept':'application/vnd.github.v3+json'}
    });
    if(!resp.ok) return;
    const fileData=await resp.json();
    if(!fileData || !fileData.content) return;
    let content = '';
    try{
      const binary = atob(fileData.content.replace(/\s/g,''));
      const bytes = new Uint8Array(binary.length);
      for(let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
      content = new TextDecoder('utf-8').decode(bytes);
    }catch(e){
      const raw=atob(fileData.content.replace(/\s/g,''));
      content=decodeURIComponent(escape(raw));
    }
    const m=content.match(/const\s+VOCAB_DATA\s*=\s*(\[[\s\S]*?\]);/);
    if(!m) return;
    const remoteVocab=JSON.parse(m[1]);
    const existingSet=new Set((typeof VOCAB_DATA !== 'undefined' ? VOCAB_DATA : []).map(w=>w.word.toLowerCase()));
    if(typeof VOCAB_DATA === 'undefined') window.VOCAB_DATA = [];
    let added=0;
    for(const w of remoteVocab){
      if(!existingSet.has(w.word.toLowerCase())){
        VOCAB_DATA.push(w);
        existingSet.add(w.word.toLowerCase());
        added++;
      }
    }
    console.log(`Remote vocab loaded: ${remoteVocab.length} words (${added} new merged)`);
  }catch(err){
    // Keep local vocabulary intact without throwing
  }
}

// ===== Init =====
let currentOptionWords = [];

async function initApp(){
  await loadRemoteVocab();
  await initDB();
  // 初始化艾宾浩斯调度器（本地算法，无需外部库）后加载进度
  try{
    getFSRSScheduler();
  }catch(e){
    console.error('Failed to init scheduler:',e);
    showToast('调度器初始化失败，请刷新重试');
  }
  loadCustomVocab();
  if(dbInstance){
    const dbCustom=await dbGet('customVocab');
    if(dbCustom && Array.isArray(dbCustom) && dbCustom.length>customVocab.length){
      customVocab=dbCustom;
      if(storageAvailable){ try{ localStorage.setItem('customVocab',JSON.stringify(customVocab)); }catch(e){} }
    }
  }
  // Merge custom vocabulary into system vocabulary (VOCAB_DATA)
  mergeCustomVocabToSystem();
  let user = null;
  if(dbInstance) user = await dbGet('currentUser');
  if(!user && storageAvailable) user = localStorage.getItem('currentUser');
  if(!user){ renderLogin(); }
  else {
    currentUser = user;
    await loadProgressFromDB();
    if(!progress || !progress.words) loadProgress();
    _cachedPendingSession = await loadSessionFromDB();
    if(_cachedPendingSession && storageAvailable){
      try{
        const sCopy={..._cachedPendingSession,
          studiedWords:[...(_cachedPendingSession.studiedWords||[])],
          retestInserted:[...(_cachedPendingSession.retestInserted||[])],
          answeredWords:[...(_cachedPendingSession.answeredWords||[])]};
        localStorage.setItem(getStorageKey('vocabSession'),JSON.stringify(sCopy));
      }catch(e){}
    }
    renderHome();
    showView('home');
  }
}

initApp();
</script>
</body>
</html>
